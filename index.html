  <!-- 1. ESTILOS VISUAIS DA PÁGINA (CSS)                                    -->
  <!-- ===================================================================== -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #2a0a0a, #090507 80%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .container-jogo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      max-width: 820px;
      width: 100%;
    }

    h1 {
      font-size: 1.75rem;
      color: #fb923c;
      text-shadow: 0 0 14px rgba(234, 88, 12, 0.7);
      letter-spacing: 0.5px;
      text-align: center;
    }

    /* Barra superior com Fase, Pontos, Barras de Ouro e Vidas */
    .painel-status {
      width: 800px;
      max-width: 100%;
      background-color: #1c1010;
      border: 2px solid #7c2d12;
      border-radius: 10px;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.05rem;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    /* Área principal do jogo */
    .area-canvas {
      position: relative;
      width: 800px;
      max-width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(234, 88, 12, 0.25);
      border: 3px solid #ea580c;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background-color: #1a0707;
      cursor: pointer;
    }

    /* Tela sobreposta de Vitória ou Derrota */
    .tela-final {
      position: absolute;
      inset: 0;
      background-color: rgba(12, 5, 5, 0.88);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      z-index: 10;
    }

    .tela-final.oculto {
      display: none;
    }

    .caixa-mensagem {
      background-color: #1f1212;
      border: 2px solid #f97316;
      border-radius: 14px;
      padding: 28px 36px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
    }

    .caixa-mensagem h2 {
      font-size: 1.9rem;
      margin-bottom: 10px;
    }

    .caixa-mensagem p {
      font-size: 1.02rem;
      color: #e2e8f0;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .pontuacao-final {
      font-size: 1.25rem;
      color: #facc15 !important;
      margin-bottom: 20px !important;
    }

    #btnReiniciar {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px 26px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.4);
    }

    #btnReiniciar:hover {
      filter: brightness(1.15);
      transform: scale(1.05);
    }

    #btnReiniciar:active {
      transform: scale(0.98);
    }

    /* Barra inferior de controles */
    .controles-info {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      font-size: 0.9rem;
      color: #fed7aa;
      background-color: #1c1010;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #7c2d12;
      text-align: center;
    }

    /* Botões táteis responsivos para dispositivos móveis */
    .controles-touch {
      display: none;
      width: 100%;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
    }

    .grupo-direcional {
      display: flex;
      gap: 12px;
    }

    .btn-touch {
      background-color: #1c1010;
      color: #fb923c;
      border: 2px solid #ea580c;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 1.1rem;
      font-weight: bold;
      user-select: none;
      touch-action: manipulation;
    }

    .btn-touch:active {
      background-color: #ea580c;
      color: #ffffff;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.35rem;
      }
      .painel-status {
        font-size: 0.95rem;
        padding: 8px 12px;
      }
      .controles-touch {
        display: flex;
      }
    }
  </style>
</head>

        jogador.noChao = false;
      }

      if (tecla === "arrowleft" || tecla === "a") teclas.esquerda = true;
      if (tecla === "arrowright" || tecla === "d") teclas.direita = true;

      if (evento.code === "Space" || tecla === "arrowup" || tecla === "w") {
        evento.preventDefault();
        tentarPular();
      }
    });

      elemento.addEventListener("touchstart", (e) => {
        e.preventDefault();
        teclas[propriedade] = true;
      }, { passive: false });
      elemento.addEventListener("touchend", (e) => {
        e.preventDefault();
        teclas[propriedade] = false;
      }, { passive: false });
      elemento.addEventListener("mousedown", () => { teclas[propriedade] = true; });
      elemento.addEventListener("mouseup", () => { teclas[propriedade] = false; });
      elemento.addEventListener("mouseleave", () => { teclas[propriedade] = false; });
    }

    vincularBotaoDirecional(btnEsq, "esquerda");
    vincularBotaoDirecional(btnDir, "direita");

    btnPular.addEventListener("touchstart", (e) => {
      e.preventDefault();
      tentarPular();
    }, { passive: false });
    btnPular.addEventListener("mousedown", tentarPular);

    // ========================================================================
    // INICIALIZAÇÃO E REINÍCIO DO JOGO
    // ========================================================================
    function iniciarJogo(manterPontos = false) {
      const fase = FASES[faseAtual];

      if (!manterPontos) {
        pontos = 0;
        vidas = CONFIG.vidasIniciais;
      }

      jogoEncerrado = false;
      cameraX = 0;
      tremorTela = 0;
      mensagemAviso = "";
      tempoAviso = 0;

      // Atualiza título da fase atual
      elTituloJogo.textContent = fase.titulo;

      // Reseta jogador
      jogador.x = 70;
      jogador.y = 340;
      jogador.velX = 0;
      jogador.velY = 0;
      jogador.noChao = false;
      jogador.direcao = 1;
      jogador.anguloRoda = 0;
      jogador.invencivel = 0;

      // Configura o Vilão Gigante exclusivo desta fase
      chefeVilao.x = 2840;
      chefeVilao.y = 262;
      chefeVilao.velX = -1.4 - faseAtual * 0.35;
      chefeVilao.hp = fase.vilao.hp;
      chefeVilao.hpMax = fase.vilao.hp;
      chefeVilao.nome = fase.vilao.nome;
      chefeVilao.tipo = fase.vilao.tipo;
      chefeVilao.vivo = true;
      chefeVilao.invencivel = 0;
      chefeVilao.anguloEsteira = 0;

      // Carrega plataformas, perigos, ouro e inimigos da fase atual
      plataformas = fase.plataformas.map((p) => ({ ...p }));
      perigosLava = fase.perigos.map((p) => ({ ...p }));
      barrasOuro = fase.barrasOuro.map((b) => ({ ...b, coletada: false }));
      inimigos = fase.inimigos.map((i) => ({ ...i, vivo: true, anguloRoda: 0 }));

      // Cria partículas climáticas (brasas na Fase 1, neve na Fase 2, faíscas neon na Fase 3)
      brasas = [];
      for (let i = 0; i < 45; i++) {
        brasas.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          raio: 1.5 + Math.random() * 2.5,
          velY: faseAtual === 1 ? 0.8 + Math.random() * 1.5 : -0.6 - Math.random() * 1.4,
          velX: (Math.random() - 0.5) * 0.9
        });
      }

      bolasLava = [];
      particulasExplosao = [];
      tempoProximoJato = 40;

      telaFinal.classList.add("oculto");
      btnReiniciar.blur();
      atualizarHUD();
    }

    btnReiniciar.addEventListener("click", () => {
      if (acaoBotaoFinal === "proximaFase") {
        faseAtual++;
        vidas = Math.min(CONFIG.vidasIniciais, vidas + 1);
        iniciarJogo(true);
      } else if (acaoBotaoFinal === "reiniciarTudo") {
        faseAtual = 0;
        iniciarJogo(false);
      } else {
        iniciarJogo(false);
      }
    });

    // Gera partículas de explosão (faíscas, fogo e estilhaços metálicos)
    function criarExplosao(x, y, cores, quantidade = 22) {
      for (let i = 0; i < quantidade; i++) {
        const angulo = Math.random() * Math.PI * 2;
        const velocidade = 2 + Math.random() * 6.5;
        particulasExplosao.push({
          x,
          y,
          velX: Math.cos(angulo) * velocidade,
          velY: Math.sin(angulo) * velocidade - 2.5,
          raio: 2.5 + Math.random() * 4.5,
          cor: cores[Math.floor(Math.random() * cores.length)],
          vida: 28 + Math.floor(Math.random() * 18),
          vidaMax: 46
        });
      }
    }

    function atualizarHUD() {
      const coletadas = barrasOuro.filter((b) => b.coletada).length;
      elFase.textContent = `${faseAtual + 1}/${FASES.length}`;
      elPontos.textContent = pontos;
      elOuro.textContent = `${coletadas}/${barrasOuro.length}`;
      elVidas.textContent = vidas;
    }

    function mostrarAviso(texto) {
      mensagemAviso = texto;
      tempoAviso = 130;
    }

    // ========================================================================
    // LÓGICA, FÍSICA E COLISÕES
    // ========================================================================
    function verificarColisao(a, b) {
      return (
        a.x < b.x + b.largura &&
        a.x + a.largura > b.x &&
        a.y < b.y + b.altura &&
        a.y + a.altura > b.y
      );
    }

    function sofrerDano(mensagem = "Cuidado! Seu carro sofreu dano!") {
      if (jogador.invencivel > 0) return;

      vidas--;
      tremorTela = 12;
      criarExplosao(
        jogador.x + jogador.largura / 2,
        jogador.y + jogador.altura / 2,
        ["#ef4444", "#f97316", "#facc15"],
        16
      );
      atualizarHUD();

      if (vidas <= 0) {
        finalizarJogo(false);
      } else {
        jogador.invencivel = 90;
        jogador.velY = -8;
        mostrarAviso(mensagem);
      }
    }

    function finalizarJogo(venceu) {
      jogoEncerrado = true;

      if (venceu) {
        const todasColetadas = barrasOuro.every((b) => b.coletada);
        let msgExtra = `Você derrotou ${chefeVilao.nome}!`;
        if (todasColetadas) {
          pontos += CONFIG.bonusTodasBarras;
          msgExtra += ` Bônus de +${CONFIG.bonusTodasBarras} pts por pegar todas as barras de ouro!`;
        }
        atualizarHUD();

        if (faseAtual < FASES.length - 1) {
          acaoBotaoFinal = "proximaFase";
          tituloFinal.textContent = `🎉 Fase ${faseAtual + 1} Concluída!`;
          tituloFinal.style.color = "#38bdf8";
          textoFinal.textContent = `${msgExtra} Prepare-se para a próxima fase (+1 vida bônus)!`;
          btnReiniciar.textContent = `➡️ Ir para a Fase ${faseAtual + 2}`;
        } else {
          acaoBotaoFinal = "reiniciarTudo";
          tituloFinal.textContent = "🏆 Campeão Supremo! Você Zerou!";
          tituloFinal.style.color = "#4ade80";
          textoFinal.textContent = `${msgExtra} Você conquistou todas as 3 fases!`;
          btnReiniciar.textContent = "🔄 Jogar Novamente (Fase 1)";
        }
      } else {
        acaoBotaoFinal = "reiniciarFase";
        tituloFinal.textContent = "💥 Carro Destruído!";
        tituloFinal.style.color = "#f87171";
        textoFinal.textContent = "Os perigos e os inimigos venceram desta vez. Tente novamente!";
        btnReiniciar.textContent = `🔄 Tentar Fase ${faseAtual + 1} Novamente`;
      }

      pontosFinais.textContent = pontos;
      telaFinal.classList.remove("oculto");
    }

    function atualizarErupcaoVulcao() {
      // Atualiza partículas atmosféricas (brasas, neve ou faíscas neon)
      for (const brasa of brasas) {
        brasa.y += brasa.velY;
        brasa.x += brasa.velX;
        if (brasa.y < 0) {
          brasa.y = canvas.height;
          brasa.x = Math.random() * canvas.width;
        } else if (brasa.y > canvas.height) {
          brasa.y = 0;
          brasa.x = Math.random() * canvas.width;
        }
      }

      // Atualiza partículas de explosão no mundo
      for (let i = particulasExplosao.length - 1; i >= 0; i--) {
        const p = particulasExplosao[i];
        p.x += p.velX;
        p.y += p.velY;
        p.velY += 0.25;
        p.vida--;
        if (p.vida <= 0) {
          particulasExplosao.splice(i, 1);
        }
      }

      // Na Fase 1, dispara bolas de lava da cratera do vulcão de fundo
      if (faseAtual !== 0) return;

      tempoProximoJato--;
      if (tempoProximoJato <= 0) {
        tempoProximoJato = 35 + Math.floor(Math.random() * 45);
        for (let i = 0; i < 3; i++) {
          bolasLava.push({
            x: 430 + (Math.random() - 0.5) * 30,
            y: 118,
            velX: (Math.random() - 0.5) * 6.5,
            velY: -4.5 - Math.random() * 4.5,
            raio: 4 + Math.random() * 4,
            vida: 110
          });
        }
      }

      for (let i = bolasLava.length - 1; i >= 0; i--) {
        const bola = bolasLava[i];
        bola.x += bola.velX;
        bola.y += bola.velY;
        bola.velY += 0.22;
        bola.vida--;
        if (bola.vida <= 0 || bola.y > canvas.height) {
          bolasLava.splice(i, 1);
        }
      }
    }

    function atualizar() {
      atualizarErupcaoVulcao();
      if (jogoEncerrado) return;

      if (jogador.invencivel > 0) jogador.invencivel--;
      if (tempoAviso > 0) tempoAviso--;
      if (tremorTela > 0) tremorTela--;

      // --- Movimento Horizontal do Carro Monstro ---
      jogador.velX = 0;
      if (teclas.esquerda) {
        jogador.velX = -CONFIG.velocidadeCarro;
        jogador.direcao = -1;
      }
      if (teclas.direita) {
        jogador.velX = CONFIG.velocidadeCarro;
        jogador.direcao = 1;
      }

      jogador.x += jogador.velX;
      jogador.anguloRoda += jogador.velX * 0.08;

      // Limites da pista
      if (jogador.x < 0) jogador.x = 0;
      if (jogador.x + jogador.largura > CONFIG.larguraMundo) {
        jogador.x = CONFIG.larguraMundo - jogador.largura;
      }

      // Colisão lateral com plataformas
      for (const plat of plataformas) {
        if (verificarColisao(jogador, plat)) {
          if (jogador.velX > 0) jogador.x = plat.x - jogador.largura;
          if (jogador.velX < 0) jogador.x = plat.x + plat.largura;
        }
      }

      // --- Movimento Vertical e Gravidade ---
      jogador.velY += CONFIG.gravidade;
      jogador.noChao = false;
      jogador.y += jogador.velY;

      for (const plat of plataformas) {
        if (verificarColisao(jogador, plat)) {
          if (jogador.velY > 0) {
            jogador.y = plat.y - jogador.altura;
            jogador.velY = 0;
            jogador.noChao = true;
          } else if (jogador.velY < 0) {
            jogador.y = plat.y + plat.altura;
            jogador.velY = 0;
          }
        }
      }

      // Atualiza Câmera (mantém o carro visível à esquerda da tela)
      cameraX = jogador.x - 240;
      if (cameraX < 0) cameraX = 0;
      if (cameraX > CONFIG.larguraMundo - canvas.width) {
        cameraX = CONFIG.larguraMundo - canvas.width;
      }

      // --- Coleta das Barras de Ouro ---
      for (const barra of barrasOuro) {
        if (barra.coletada) continue;
        const areaBarra = { x: barra.x, y: barra.y, largura: 30, altura: 18 };
        if (verificarColisao(jogador, areaBarra)) {
          barra.coletada = true;
          pontos += CONFIG.pontosPorBarraOuro;
          criarExplosao(barra.x + 15, barra.y + 8, ["#fef08a", "#facc15", "#ffffff"], 10);
          atualizarHUD();
        }
      }

      // --- Carros Monstros Vermelhos (Inimigos) ---
      for (const inimigo of inimigos) {
        if (!inimigo.vivo) continue;

        inimigo.x += inimigo.velX;
        inimigo.anguloRoda += inimigo.velX * 0.08;

        if (inimigo.x <= inimigo.minX || inimigo.x + inimigo.largura >= inimigo.maxX) {
          inimigo.velX *= -1;
        }

        if (verificarColisao(jogador, inimigo)) {
          const rodasAnteriores = jogador.y + jogador.altura - jogador.velY;
          if (jogador.velY > 0 && rodasAnteriores <= inimigo.y + inimigo.altura * 0.55) {
            inimigo.vivo = false;
            jogador.velY = -11;
            tremorTela = 8;
            criarExplosao(
              inimigo.x + inimigo.largura / 2,
              inimigo.y + inimigo.altura / 2,
              ["#ef4444", "#f97316", "#facc15", "#e2e8f0"],
              24
            );
            pontos += CONFIG.pontosPorInimigo;
            atualizarHUD();
          } else {
            sofrerDano("Os espinhos do Carro Monstro Vermelho te atingiram!");
          }
        }
      }

      // --- Perigos na Estrada (Lava / Nitrogênio / Ácido) ---
      for (const lava of perigosLava) {
        if (verificarColisao(jogador, lava)) {
          sofrerDano(FASES[faseAtual].avisoPerigo);
        }
      }

      // --- Vilão Gigante (Chefe Final da Fase) ---
      if (chefeVilao.vivo) {
        if (chefeVilao.invencivel > 0) chefeVilao.invencivel--;

        chefeVilao.x += chefeVilao.velX;
        chefeVilao.anguloEsteira += chefeVilao.velX * 0.08;
        if (chefeVilao.x <= chefeVilao.minX || chefeVilao.x + chefeVilao.largura >= chefeVilao.maxX) {
          chefeVilao.velX *= -1;
        }

        if (verificarColisao(jogador, chefeVilao)) {
          const rodasAnteriores = jogador.y + jogador.altura - jogador.velY;
          // Se pular no cristal vulnerável no topo da cabeça do Vilão
          if (jogador.velY > 0 && rodasAnteriores <= chefeVilao.y + 46) {
            jogador.velY = -13.5;
            if (chefeVilao.invencivel === 0) {
              chefeVilao.hp--;
              chefeVilao.invencivel = 45;
              tremorTela = 16;
              criarExplosao(
                chefeVilao.x + chefeVilao.largura / 2,
                chefeVilao.y + 10,
                ["#22d3ee", "#facc15", "#f97316", "#ffffff"],
                26
              );

              if (chefeVilao.hp <= 0) {
                chefeVilao.vivo = false;
                criarExplosao(
                  chefeVilao.x + chefeVilao.largura / 2,
                  chefeVilao.y + chefeVilao.altura / 2,
                  ["#ef4444", "#f97316", "#facc15", "#22d3ee", "#e2e8f0"],
                  55
                );
                pontos += CONFIG.pontosPorDerrotarChefe;
                atualizarHUD();
                mostrarAviso(`BOOOOM! Você destruiu ${chefeVilao.nome}! Cruze a chegada!`);
              } else {
                mostrarAviso(`Acerto no cristal! Faltam ${chefeVilao.hp} golpes em ${chefeVilao.nome}!`);
              }
            }
          } else {
            sofrerDano(`As garras de ${chefeVilao.nome} te atingiram!`);
          }
        }
      }

      // --- Linha de Chegada ---
      if (jogador.x + jogador.largura >= CONFIG.posicaoChegada) {
        if (chefeVilao.vivo) {
          jogador.x = CONFIG.posicaoChegada - jogador.largura - 5;
          mostrarAviso(`Derrote ${chefeVilao.nome} antes de cruzar!`);
        } else {
          finalizarJogo(true);
        }
      }
    }

    // ========================================================================
    // DESENHO DOS GRÁFICOS NO CANVAS
    // ========================================================================
    function desenharFundoVulcao() {
      // FASE 2: GELEIRA CONGELADA COM AURORA BOREAL
      if (faseAtual === 1) {
        const gradGelo = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradGelo.addColorStop(0, "#020617");
        gradGelo.addColorStop(0.55, "#0c4a6e");
        gradGelo.addColorStop(1, "#38bdf8");
        ctx.fillStyle = gradGelo;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Ondas de Aurora Boreal animadas
        const onda = Math.sin(Date.now() / 600) * 18;
        ctx.fillStyle = "rgba(52, 211, 153, 0.22)";
        ctx.beginPath();
        ctx.moveTo(0, 110 + onda);
        ctx.quadraticCurveTo(260, 45 - onda, 520, 105 + onda);
        ctx.quadraticCurveTo(680, 140 - onda, 800, 80 + onda);
        ctx.lineTo(800, 165);
        ctx.lineTo(0, 165);
        ctx.closePath();
        ctx.fill();

        // Montanhas glaciais em parallax
        for (let i = 0; i < 6; i++) {
          const picoX = i * 240 - ((cameraX * 0.14) % 240);
          ctx.fillStyle = "#0f294a";
          ctx.beginPath();
          ctx.moveTo(picoX - 100, 410);
          ctx.lineTo(picoX + 70, 165);
          ctx.lineTo(picoX + 240, 410);
          ctx.closePath();
          ctx.fill();

          // Topo nevado brilhante
          ctx.fillStyle = "#e0f2fe";
          ctx.beginPath();
          ctx.moveTo(picoX + 70, 165);
          ctx.lineTo(picoX + 28, 225);
          ctx.lineTo(picoX + 68, 212);
          ctx.lineTo(picoX + 112, 225);
          ctx.closePath();
          ctx.fill();
        }

        // Flocos de neve caindo
        ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
        for (const floco of brasas) {
          ctx.beginPath();
          ctx.arc(floco.x, floco.y, floco.raio, 0, Math.PI * 2);
          ctx.fill();
        }
        return;
      }

      // FASE 3: FORTALEZA CIBERNÉTICA NEON-TÓXICA
      if (faseAtual === 2) {
        const gradCiber = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradCiber.addColorStop(0, "#090514");
        gradCiber.addColorStop(0.55, "#2e1065");
        gradCiber.addColorStop(1, "#581c87");
        ctx.fillStyle = gradCiber;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Torres industriais futuristas em parallax
        for (let i = 0; i < 7; i++) {
          const tx = i * 190 - ((cameraX * 0.15) % 190);
          const alt = 150 + (i % 3) * 45;
          ctx.fillStyle = "#130b24";
          ctx.fillRect(tx, 410 - alt, 95, alt);
          ctx.strokeStyle = "#7e22ce";
          ctx.lineWidth = 1.5;
          ctx.strokeRect(tx, 410 - alt, 95, alt);

          // Janelas neon verdes e roxas
          ctx.fillStyle = i % 2 === 0 ? "#4ade80" : "#c084fc";
          for (let wy = 410 - alt + 18; wy < 385; wy += 24) {
            ctx.fillRect(tx + 14, wy, 24, 5);
            ctx.fillRect(tx + 54, wy, 24, 5);
          }
        }

        // Faíscas de plasma tóxico subindo
        ctx.fillStyle = "rgba(74, 222, 128, 0.8)";
        for (const faisca of brasas) {
          ctx.beginPath();
          ctx.arc(faisca.x, faisca.y, faisca.raio, 0, Math.PI * 2);
          ctx.fill();
        }
        return;
      }

      // FASE 1: VULCÃO EM ERUPÇÃO
      const gradCeu = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradCeu.addColorStop(0, "#0c0404");
      gradCeu.addColorStop(0.55, "#450a0a");
      gradCeu.addColorStop(1, "#9a3412");
      ctx.fillStyle = gradCeu;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Montanhas vulcânicas distantes (efeito parallax lento)
      ctx.fillStyle = "#1f0909";
      for (let i = 0; i < 6; i++) {
        const picoX = i * 240 - ((cameraX * 0.12) % 240);
        ctx.beginPath();
        ctx.moveTo(picoX - 100, 410);
        ctx.lineTo(picoX + 70, 190);
        ctx.lineTo(picoX + 240, 410);
        ctx.closePath();
        ctx.fill();
      }

      // GRANDE VULCÃO PRINCIPAL JOGANDO LAVA PRA FORA
      const vx = 430 - cameraX * 0.06;
      ctx.fillStyle = "#180808";
      ctx.beginPath();
      ctx.moveTo(vx - 260, 410);
      ctx.lineTo(vx - 45, 115);
      ctx.lineTo(vx + 45, 115);
      ctx.lineTo(vx + 260, 410);
      ctx.closePath();
      ctx.fill();

      // Brilho da cratera no topo
      const brilhoCratera = ctx.createRadialGradient(vx, 115, 5, vx, 115, 75);
      brilhoCratera.addColorStop(0, "#fef08a");
      brilhoCratera.addColorStop(0.4, "#f97316");
      brilhoCratera.addColorStop(1, "rgba(234, 88, 12, 0)");
      ctx.fillStyle = brilhoCratera;
      ctx.beginPath();
      ctx.arc(vx, 115, 75, 0, Math.PI * 2);
      ctx.fill();

      // Rios de lava escorrendo pela encosta do vulcão
      ctx.strokeStyle = "#f97316";
      ctx.lineWidth = 7;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(vx - 20, 118);
      ctx.quadraticCurveTo(vx - 55, 220, vx - 125, 360);
      ctx.moveTo(vx + 15, 118);
      ctx.quadraticCurveTo(vx + 65, 210, vx + 135, 380);
      ctx.stroke();

      ctx.strokeStyle = "#facc15";
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Bolas de lava sendo cuspidas pelo vulcão
      for (const bola of bolasLava) {
        const bx = bola.x - cameraX * 0.06;
        ctx.fillStyle = "#facc15";
        ctx.beginPath();
        ctx.arc(bx, bola.y, bola.raio, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(239, 68, 68, 0.55)";
        ctx.beginPath();
        ctx.arc(bx, bola.y, bola.raio * 1.8, 0, Math.PI * 2);
        ctx.fill();
      }

      // Brasas flutuantes no ar
      for (const brasa of brasas) {
        ctx.fillStyle = "rgba(251, 146, 60, 0.8)";
        ctx.beginPath();
        ctx.arc(brasa.x, brasa.y, brasa.raio, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Desenha Carros Monstros (Jogador e Inimigos Vermelhos) com Espinhos e Rodas com Cravos
    function desenharCarroMonstro(x, y, largura, altura, corPrincipal, corDetalhe, direcao, anguloRoda, ehInimigo = false) {
      ctx.save();

      // 1. Suspensão elevada com amortecedores
      ctx.strokeStyle = "#cbd5e1";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x + 15, y + altura - 18);
      ctx.lineTo(x + 15, y + altura - 6);
      ctx.moveTo(x + largura - 15, y + altura - 18);
      ctx.lineTo(x + largura - 15, y + altura - 6);
      ctx.stroke();

      // Molas helicoidais vermelhas/amarelas
      ctx.strokeStyle = ehInimigo ? "#facc15" : "#f97316";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + 12, y + altura - 16);
      ctx.lineTo(x + 18, y + altura - 12);
      ctx.lineTo(x + 12, y + altura - 8);
      ctx.moveTo(x + largura - 18, y + altura - 16);
      ctx.lineTo(x + largura - 12, y + altura - 12);
      ctx.lineTo(x + largura - 18, y + altura - 8);
      ctx.stroke();

      // 2. Chassi / Lataria robusta
      ctx.fillStyle = corPrincipal;
      ctx.strokeStyle = "#09090b";
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.roundRect(x + 5, y + 11, largura - 10, altura - 23, 6);
      ctx.fill();
      ctx.stroke();

      // 3. Cabine com Santo-Antônio
      const cabineX = direcao === 1 ? x + 13 : x + 21;
      ctx.fillStyle = corPrincipal;
      ctx.beginPath();
      ctx.roundRect(cabineX, y + 1, largura - 34, 13, 4);
      ctx.fill();
      ctx.stroke();

      // Para-brisa
      ctx.fillStyle = ehInimigo ? "#fef08a" : "#bae6fd";
      const vidroX = direcao === 1 ? cabineX + (largura - 34) - 12 : cabineX + 2;
      ctx.fillRect(vidroX, y + 3, 10, 8);

      // Faixa lateral
      ctx.fillStyle = corDetalhe;
      ctx.fillRect(x + 9, y + 17, largura - 18, 4);

      // Escapamento traseiro com chama
      const escapX = direcao === 1 ? x + 8 : x + largura - 12;
      ctx.fillStyle = "#52525b";
      ctx.fillRect(escapX, y + 4, 4, 9);
      if (Math.abs(anguloRoda) > 0) {
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.arc(escapX - direcao * 4, y + 3, 3.5 + Math.sin(Date.now() / 60) * 1.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // 4. ESPINHOS METÁLICOS NOS PARA-CHOQUES (DIANTEIRO E TRASEIRO)
      ctx.fillStyle = "#e2e8f0";
      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 1;

      for (let i = 0; i < 3; i++) {
        const sy = y + 13 + i * 5;
        // Espinhos na esquerda
        ctx.beginPath();
        ctx.moveTo(x + 5, sy);
        ctx.lineTo(x - 4, sy + 2.5);
        ctx.lineTo(x + 5, sy + 5);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Espinhos na direita
        ctx.beginPath();
        ctx.moveTo(x + largura - 5, sy);
        ctx.lineTo(x + largura + 4, sy + 2.5);
        ctx.lineTo(x + largura - 5, sy + 5);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      // 5. Rodas Gigantes com Cravos Giratórios
      const raioRoda = 11.5;
      const posRodas = [x + 15, x + largura - 15];
      const rodaY = y + altura - 9;

      for (const rx of posRodas) {
        // Cravos externos do pneu girando
        ctx.fillStyle = "#18181b";
        for (let c = 0; c < 8; c++) {
          const ang = anguloRoda + (c * Math.PI) / 4;
          const cx = rx + Math.cos(ang) * (raioRoda + 1.5);
          const cy = rodaY + Math.sin(ang) * (raioRoda + 1.5);
          ctx.beginPath();
          ctx.arc(cx, cy, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }

        // Pneu principal
        ctx.fillStyle = "#09090b";
        ctx.beginPath();
        ctx.arc(rx, rodaY, raioRoda, 0, Math.PI * 2);
        ctx.fill();

        // Aro colorido
        ctx.fillStyle = ehInimigo ? "#ef4444" : "#38bdf8";
        ctx.beginPath();
        ctx.arc(rx, rodaY, 5.5, 0, Math.PI * 2);
        ctx.fill();

        // Centro metálico
        ctx.fillStyle = "#f8fafc";
        ctx.beginPath();
        ctx.arc(rx, rodaY, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    // Desenha os 3 VILÕES GIGANTES (Lava, Gelo e Ciber-Imperador) com olhos que seguem o jogador
    function desenharChefeVilaoGigante() {
      if (!chefeVilao.vivo) return;

      const piscando = chefeVilao.invencivel > 0 && Math.floor(chefeVilao.invencivel / 4) % 2 === 0;
      if (piscando) return;

      const { x, y, largura, altura, anguloEsteira, tipo, nome } = chefeVilao;
      const temaVilao = FASES[faseAtual].vilao;
      const centroX = x + largura / 2;
      const pulso = Math.sin(Date.now() / 130);
      const animGarra = Math.sin(Date.now() / 220) * 6;

      ctx.save();

      // 1. Propulsores e Esteiras na base
      const baseY = y + altura - 26;
      for (let f = 0; f < 4; f++) {
        const fx = x + 26 + f * 33;
        const chamaAlt = 10 + Math.sin(Date.now() / 50 + f) * 4;
        ctx.fillStyle = temaVilao.corDetalhe;
        ctx.beginPath();
        ctx.moveTo(fx - 8, baseY + 22);
        ctx.lineTo(fx, baseY + 22 + chamaAlt);
        ctx.lineTo(fx + 8, baseY + 22);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = "#09090b";
      ctx.strokeStyle = temaVilao.corBorda;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.roundRect(x + 14, baseY, largura - 28, 24, 12);
      ctx.fill();
      ctx.stroke();

      for (let r = 0; r < 4; r++) {
        const rx = x + 30 + r * 30;
        const ry = baseY + 12;
        ctx.fillStyle = temaVilao.corDetalhe;
        ctx.beginPath();
        ctx.arc(rx, ry, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#18181b";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(rx + Math.cos(anguloEsteira) * 7, ry + Math.sin(anguloEsteira) * 7);
        ctx.lineTo(rx - Math.cos(anguloEsteira) * 7, ry - Math.sin(anguloEsteira) * 7);
        ctx.stroke();
      }

      // 2. Torso Gigante Blindado
      ctx.fillStyle = temaVilao.corCorpo;
      ctx.strokeStyle = temaVilao.corBorda;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x + 26, baseY);
      ctx.lineTo(x + 14, y + 48);
      ctx.lineTo(x + 42, y + 36);
      ctx.lineTo(x + largura - 42, y + 36);
      ctx.lineTo(x + largura - 14, y + 48);
      ctx.lineTo(x + largura - 26, baseY);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Veios de energia no torso
      ctx.strokeStyle = temaVilao.corDetalhe;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(x + 30, y + 65);
      ctx.lineTo(centroX - 22, y + 82);
      ctx.moveTo(x + largura - 30, y + 65);
      ctx.lineTo(centroX + 22, y + 82);
      ctx.stroke();

      // 3. Ombreiras Pontiagudas
      const ombreiras = [
        { ox: x + 16, dir: -1 },
        { ox: x + largura - 16, dir: 1 }
      ];
      for (const omb of ombreiras) {
        ctx.fillStyle = tipo === "gelo" ? "#0284c7" : "#27272a";
        ctx.strokeStyle = temaVilao.corBorda;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(omb.ox, y + 38);
        ctx.lineTo(omb.ox + omb.dir * (tipo === "ciber" ? 30 : 22), y + 22);
        ctx.lineTo(omb.ox + omb.dir * 16, y + 58);
        ctx.lineTo(omb.ox, y + 56);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      // 4. Núcleo de Energia Pulsante no Peito
      const peitoY = y + 84;
      const raioNucleo = 19 + pulso * 2.5;
      const gradNucleo = ctx.createRadialGradient(centroX, peitoY, 3, centroX, peitoY, raioNucleo + 6);
      gradNucleo.addColorStop(0, "#ffffff");
      gradNucleo.addColorStop(0.5, temaVilao.corNucleo);
      gradNucleo.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = gradNucleo;
      ctx.beginPath();
      ctx.arc(centroX, peitoY, raioNucleo + 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = temaVilao.corNucleo;
      ctx.beginPath();
      ctx.arc(centroX, peitoY, 10 + pulso * 1.5, 0, Math.PI * 2);
      ctx.fill();

      // 5. Garras Mecânicas Articuladas com Espinhos
      const garraEsqX = x - 14;
      const garraEsqY = y + 76 + animGarra;
      ctx.strokeStyle = "#3f3f46";
      ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.moveTo(x + 20, y + 62);
      ctx.lineTo(garraEsqX + 12, garraEsqY);
      ctx.stroke();

      ctx.fillStyle = tipo === "gelo" ? "#bae6fd" : tipo === "ciber" ? "#4ade80" : "#cbd5e1";
      ctx.beginPath();
      ctx.moveTo(garraEsqX + 14, garraEsqY - 8);
      ctx.lineTo(garraEsqX - 10, garraEsqY - 14);
      ctx.lineTo(garraEsqX + 4, garraEsqY - 2);
      ctx.moveTo(garraEsqX + 14, garraEsqY + 8);
      ctx.lineTo(garraEsqX - 10, garraEsqY + 14);
      ctx.lineTo(garraEsqX + 4, garraEsqY + 2);
      ctx.fill();

      const garraDirX = x + largura + 14;
      const garraDirY = y + 76 - animGarra;
      ctx.strokeStyle = "#3f3f46";
      ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.moveTo(x + largura - 20, y + 62);
      ctx.lineTo(garraDirX - 12, garraDirY);
      ctx.stroke();

      ctx.fillStyle = tipo === "gelo" ? "#bae6fd" : tipo === "ciber" ? "#4ade80" : "#cbd5e1";
      ctx.beginPath();
      ctx.moveTo(garraDirX - 14, garraDirY - 8);
      ctx.lineTo(garraDirX + 10, garraDirY - 14);
      ctx.lineTo(garraDirX - 4, garraDirY - 2);
      ctx.moveTo(garraDirX - 14, garraDirY + 8);
      ctx.lineTo(garraDirX + 10, garraDirY + 14);
      ctx.lineTo(garraDirX - 4, garraDirY + 2);
      ctx.fill();

      // 6. Cabeça Blindada, Chifres/Coroa e Cristal Vulnerável no Topo
      ctx.fillStyle = temaVilao.corCorpo;
      ctx.strokeStyle = temaVilao.corBorda;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.roundRect(centroX - 34, y + 4, 68, 36, 8);
      ctx.fill();
      ctx.stroke();

      // Chifres laterais personalizados por vilão
      ctx.fillStyle = tipo === "gelo" ? "#7dd3fc" : tipo === "ciber" ? "#9333ea" : "#27272a";
      ctx.beginPath();
      ctx.moveTo(centroX - 32, y + 16);
      ctx.quadraticCurveTo(centroX - 56, y + 6, centroX - 48, y - 16);
      ctx.lineTo(centroX - 28, y + 8);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(centroX + 32, y + 16);
      ctx.quadraticCurveTo(centroX + 56, y + 6, centroX + 48, y - 16);
      ctx.lineTo(centroX + 28, y + 8);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = temaVilao.corDetalhe;
      ctx.beginPath();
      ctx.arc(centroX - 48, y - 18, 5 + pulso * 1.5, 0, Math.PI * 2);
      ctx.arc(centroX + 48, y - 18, 5 + pulso * 1.5, 0, Math.PI * 2);
      ctx.fill();

      // CRISTAL VULNERÁVEL BRILHANTE NO TOPO DA CABEÇA
      ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
      ctx.beginPath();
      ctx.arc(centroX, y - 4, 15 + pulso * 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = temaVilao.corCristal;
      ctx.beginPath();
      ctx.moveTo(centroX, y - 16);
      ctx.lineTo(centroX + 10, y - 3);
      ctx.lineTo(centroX, y + 5);
      ctx.lineTo(centroX - 10, y - 3);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.moveTo(centroX, y - 13);
      ctx.lineTo(centroX + 4, y - 4);
      ctx.lineTo(centroX, y - 1);
      ctx.closePath();
      ctx.fill();

      // 7. OLHOS GIGANTES BRILHANTES QUE ACOMPANHAM O JOGADOR (X, Y)
      const centroJogadorX = jogador.x + jogador.largura / 2;
      const centroJogadorY = jogador.y + jogador.altura / 2;

      const olhos = [
        { ox: centroX - 15, oy: y + 22 },
        { ox: centroX + 15, oy: y + 22 }
      ];

      for (const olho of olhos) {
        ctx.fillStyle = "#fef08a";
        ctx.beginPath();
        ctx.arc(olho.ox, olho.oy, 9.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = temaVilao.corBorda;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        const anguloOlhar = Math.atan2(centroJogadorY - olho.oy, centroJogadorX - olho.ox);
        const pupilaX = olho.ox + Math.cos(anguloOlhar) * 4.2;
        const pupilaY = olho.oy + Math.sin(anguloOlhar) * 4.2;

        ctx.fillStyle = tipo === "gelo" ? "#0369a1" : "#b91c1c";
        ctx.beginPath();
        ctx.arc(pupilaX, pupilaY, 4.3, 0, Math.PI * 2);
        ctx.fill();
      }

      // 8. Barra de Vida do Chefe
      const barraLargura = 156;
      const barraX = centroX - barraLargura / 2;
      const barraY = y - 34;
      ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
      ctx.fillRect(barraX - 2, barraY - 2, barraLargura + 4, 14);
      ctx.fillStyle = temaVilao.corBorda;
      ctx.fillRect(barraX, barraY, (chefeVilao.hp / chefeVilao.hpMax) * barraLargura, 10);

      ctx.fillStyle = "#fef08a";
      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(nome, centroX, barraY - 6);
      ctx.textAlign = "left";

      ctx.restore();
    }

    function desenharBarraOuro(x, y) {
      const flutuacao = Math.sin(Date.now() / 180 + x) * 3;
      const by = y + flutuacao;

      // Trapézio 3D dourado (Barra de Ouro)
      ctx.fillStyle = "#eab308";
      ctx.beginPath();
      ctx.moveTo(x + 5, by);
      ctx.lineTo(x + 25, by);
      ctx.lineTo(x + 30, by + 16);
      ctx.lineTo(x, by + 16);
      ctx.closePath();
      ctx.fill();

      // Face superior iluminada
      ctx.fillStyle = "#fef08a";
      ctx.beginPath();
      ctx.moveTo(x + 6, by + 2);
      ctx.lineTo(x + 24, by + 2);
      ctx.lineTo(x + 22, by + 7);
      ctx.lineTo(x + 8, by + 7);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#a16207";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x + 6, by + 2, 18, 12);
    }

    function desenharParticulasExplosao() {
      for (const p of particulasExplosao) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.vida / p.vidaMax);
        ctx.fillStyle = p.cor;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.raio, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function desenhar() {
      ctx.save();

      // Efeito de tremor da tela em impactos/explosões
      if (tremorTela > 0) {
        const dx = (Math.random() - 0.5) * 8;
        const dy = (Math.random() - 0.5) * 8;
        ctx.translate(dx, dy);
      }

      // 1. Fundo da Fase Atual
      desenharFundoVulcao();

      // 2. Aplica deslocamento da câmera do mundo
      ctx.save();
      ctx.translate(-cameraX, 0);

      // Placas de distância na pista
      ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
      ctx.font = "bold 14px sans-serif";
      for (let m = 500; m <= 2500; m += 500) {
        ctx.fillText(`🚩 ${m}m`, m, 398);
      }

      // Plataformas e Estrada da Fase Atual
      const faseVisual = FASES[faseAtual];
      for (const plat of plataformas) {
        ctx.fillStyle = faseVisual.corRocha;
        ctx.fillRect(plat.x, plat.y, plat.largura, plat.altura);

        ctx.fillStyle = faseVisual.corBordaPlataforma;
        ctx.fillRect(plat.x, plat.y, plat.largura, 5);
      }

      // Poças de Perigo na Estrada (Lava / Nitrogênio / Ácido)
      for (const lava of perigosLava) {
        ctx.fillStyle = faseVisual.corPerigo1;
        ctx.fillRect(lava.x, lava.y, lava.largura, lava.altura);
        ctx.fillStyle = faseVisual.corPerigo2;
        ctx.fillRect(lava.x + 6, lava.y + 2, lava.largura - 12, 4);
      }

      // Linha de Chegada Quadriculada
      const chegadaX = CONFIG.posicaoChegada;
      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(chegadaX, 270, 6, 140);
      for (let linha = 0; linha < 6; linha++) {
        for (let col = 0; col < 3; col++) {
          ctx.fillStyle = (linha + col) % 2 === 0 ? "#ffffff" : "#09090b";
          ctx.fillRect(chegadaX + 6 + col * 12, 270 + linha * 12, 12, 12);
        }
      }

      // Barras de Ouro
      for (const barra of barrasOuro) {
        if (!barra.coletada) {
          desenharBarraOuro(barra.x, barra.y);
        }
      }

      // Carros Monstros Vermelhos (Inimigos com Espinhos)
      for (const inimigo of inimigos) {
        if (!inimigo.vivo) continue;
        const dirInimigo = inimigo.velX >= 0 ? 1 : -1;
        desenharCarroMonstro(
          inimigo.x,
          inimigo.y,
          inimigo.largura,
          inimigo.altura,
          CONFIG.corCarroInimigo,
          "#facc15",
          dirInimigo,
          inimigo.anguloRoda,
          true
        );
      }

      // Vilão Gigante da Fase Atual
      desenharChefeVilaoGigante();

      // Carro Monstro do Jogador (com Espinhos)
      const visivel = jogador.invencivel === 0 || Math.floor(jogador.invencivel / 5) % 2 === 0;
      if (visivel) {
        desenharCarroMonstro(
          jogador.x,
          jogador.y,
          jogador.largura,
          jogador.altura,
          CONFIG.corCarroJogador,
          CONFIG.corDetalheJogador,
          jogador.direcao,
          jogador.anguloRoda,
          false
        );
      }

      // Partículas de Explosão
      desenharParticulasExplosao();

      ctx.restore();

      // 3. Barra de Progresso no Topo da Tela
      const progresso = Math.min(1, jogador.x / CONFIG.posicaoChegada);
      ctx.fillStyle = "rgba(15, 10, 10, 0.75)";
      ctx.fillRect(220, 12, 360, 14);
      ctx.fillStyle = "#f97316";
      ctx.fillRect(222, 14, 356 * progresso, 10);
      ctx.strokeStyle = "#fdba74";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(220, 12, 360, 14);

      // 4. Mensagem de Aviso Temporária
      if (tempoAviso > 0) {
        ctx.fillStyle = "rgba(15, 5, 5, 0.85)";
        ctx.fillRect(140, 36, 520, 34);
        ctx.strokeStyle = "#f97316";
        ctx.strokeRect(140, 36, 520, 34);
        ctx.fillStyle = "#fde047";
        ctx.font = "bold 14px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(mensagemAviso, canvas.width / 2, 58);
        ctx.textAlign = "left";
      }

      ctx.restore();
    }

    // ========================================================================
    // LOOP PRINCIPAL DO JOGO
    // ========================================================================
    function loopJogo() {
      atualizar();
      desenhar();
      requestAnimationFrame(loopJogo);
    }

    window.onload = function () {
      iniciarJogo(false);
      loopJogo();
    };
  </script>
</body>
