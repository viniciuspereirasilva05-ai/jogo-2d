<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Need for Speed 2D - Platformer Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0b0c10;
            color: #66fcf1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        header {
            margin-bottom: 12px;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #45f3ff;
            text-shadow: 0 0 12px rgba(69, 243, 255, 0.6);
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #c5c6c7;
        }

        #game-wrapper {
            position: relative;
            border: 4px solid #45f3ff;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(69, 243, 255, 0.3), inset 0 0 15px rgba(0,0,0,0.8);
            background: #000;
        }

        canvas {
            display: block;
            border-radius: 8px;
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
        }

        /* Heads Up Display (HUD) */
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            font-size: 1.1rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }

        .hud-card {
            background: rgba(11, 12, 16, 0.75);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(69, 243, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Overlay para Game Over e Vitória */
        #screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 12, 16, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        #screen-overlay.hidden {
            display: none !important;
        }

        #overlay-title {
            font-size: 3rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .win-title {
            color: #45f3ff;
            text-shadow: 0 0 20px #45f3ff;
        }

        .lose-title {
            color: #ff3366;
            text-shadow: 0 0 20px #ff3366;
        }

        #overlay-desc {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 25px;
        }

        .btn-restart {
            padding: 12px 32px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #0b0c10;
            background: #45f3ff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(69, 243, 255, 0.6);
            transition: all 0.2s ease;
        }

        .btn-restart:hover {
            transform: scale(1.08);
            background: #66fcf1;
            box-shadow: 0 0 25px rgba(102, 252, 241, 0.9);
        }

        /* Rodapé com Instruções */
        footer {
            margin-top: 15px;
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
            color: #c5c6c7;
        }

        .key-badge {
            background: #1f2833;
            border: 1px solid #45f3ff;
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>NEED FOR SPEED 2D</h1>
        <p class="subtitle">Platformer Circuit - Alcance a Linha de Chegada!</p>
    </header>

    <div id="game-wrapper">
        <!-- Canvas onde o jogo é renderizado -->
        <canvas id="gameCanvas" width="850" height="420"></canvas>

        <!-- Painel de estatísticas no jogo -->
        <div id="hud">
            <div class="hud-card">
                <span>PONTOS:</span>
                <span id="scoreText" style="color: #ffbd59;">0</span>
            </div>
            <div class="hud-card">
                <span>VIDAS:</span>
                <span id="livesText" style="color: #ff3366;">❤️❤️❤️</span>
            </div>
        </div>

        <!-- Tela de Vitória / Derrota -->
        <div id="screen-overlay">
            <h2 id="overlay-title" class="win-title">VITÓRIA!</h2>
            <p id="overlay-desc">Você completou o circuito com sucesso!</p>
            <button class="btn-restart" onclick="restartGame()">JOGAR NOVAMENTE</button>
        </div>
    </div>

    <footer>
        <div><span class="key-badge">A</span> / <span class="key-badge">D</span> ou <span class="key-badge">◄</span> <span class="key-badge">►</span> Mover</div>
        <div><span class="key-badge">ESPAÇO</span> ou <span class="key-badge">▲</span> / <span class="key-badge">W</span> Pular</div>
    </footer>

    <script>
        // ==========================================
        // CONFIGURAÇÕES E ESTADO DO JOGO
        // ==========================================
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreText = document.getElementById("scoreText");
        const livesText = document.getElementById("livesText");
        const overlay = document.getElementById("screen-overlay");
        const overlayTitle = document.getElementById("overlay-title");
        const overlayDesc = document.getElementById("overlay-desc");

        // Variáveis globais do ciclo
        let animationId;
        let gameOver = false;
        let score = 0;
        let lives = 3;

        // Câmera deslizante (Side-scroller)
        let cameraX = 0;
        const LEVEL_WIDTH = 3200; // Tamanho total da pista

        // Estado dos controles do jogador
        const keys = {
            left: false,
            right: false,
            up: false
        };

        // Escutadores de eventos do teclado
        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
            if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
            if (e.key === "ArrowUp" || e.key === "w" || e.key === "W" || e.key === " ") {
                if (!keys.up && player.grounded) {
                    player.vy = player.jumpPower;
                    player.grounded = false;
                }
                keys.up = true;
            }
        });

        window.addEventListener("keyup", (e) => {
            if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
            if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
            if (e.key === "ArrowUp" || e.key === "w" || e.key === "W" || e.key === " ") keys.up = false;
        });

        // ==========================================
        // ENTIDADES DO JOGO
        // ==========================================

        // O Jogador (Carro de Corrida 2D)
        const player = {
            x: 60,
            y: 280,
            width: 50,
            height: 24,
            speed: 5.5,
            vx: 0,
            vy: 0,
            gravity: 0.55,
            jumpPower: -11.5,
            grounded: false,
            invulnerable: false,
            invulnerableTimer: 0,

            reset() {
                this.x = 60;
                this.y = 280;
                this.vx = 0;
                this.vy = 0;
                this.grounded = false;
                this.invulnerable = false;
            },

            update() {
                // Movimento Horizontal
                if (keys.right) this.vx = this.speed;
                else if (keys.left) this.vx = -this.speed;
                else this.vx = 0;

                // Gravidade
                this.vy += this.gravity;

                // Aplicação da Velocidade
                this.x += this.vx;
                this.y += this.vy;

                // Limites do Nível (Esquerda)
                if (this.x < 0) this.x = 0;

                // Atualizar Efeito de Invulnerabilidade após levar dano
                if (this.invulnerable) {
                    this.invulnerableTimer--;
                    if (this.invulnerableTimer <= 0) {
                        this.invulnerable = false;
                    }
                }
            },

            draw(cameraX) {
                // Efeito piscar se estiver temporariamente imune
                if (this.invulnerable && Math.floor(Date.now() / 100) % 2 === 0) return;

                const drawX = this.x - cameraX;
                const drawY = this.y;

                // Corpo do Carro Esportivo
                ctx.fillStyle = "#ff3366";
                ctx.beginPath();
                ctx.roundRect(drawX, drawY + 6, this.width, this.height - 6, [4]);
                ctx.fill();

                // Teto / Vidro
                ctx.fillStyle = "#45f3ff";
                ctx.beginPath();
                ctx.roundRect(drawX + 12, drawY, 22, 10, [3, 3, 0, 0]);
                ctx.fill();

                // Rodas (Esquerda / Direita)
                ctx.fillStyle = "#111";
                ctx.beginPath();
                ctx.arc(drawX + 10, drawY + this.height, 6, 0, Math.PI * 2);
                ctx.arc(drawX + this.width - 10, drawY + this.height, 6, 0, Math.PI * 2);
                ctx.fill();

                // Detalhes das rodas (Aros)
                ctx.fillStyle = "#aaa";
                ctx.beginPath();
                ctx.arc(drawX + 10, drawY + this.height, 2, 0, Math.PI * 2);
                ctx.arc(drawX + this.width - 10, drawY + this.height, 2, 0, Math.PI * 2);
                ctx.fill();

                // Faróis
                ctx.fillStyle = "#ffbd59";
                ctx.fillRect(drawX + this.width - 4, drawY + 10, 4, 4);
            }
        };

        // Estrutura das Plataformas
        let platforms = [];
        let coins = [];
        let obstacles = [];
        let finishLine = { x: 3050, y: 0, width: 40, height: 420 };

        function initLevel() {
            // Criando Plataformas / Pistas Elevadas
            platforms = [
                // Asfalto principal do chão
                { x: 0, y: 360, width: 900, height: 60 },
                { x: 1000, y: 360, width: 800, height: 60 },
                { x: 1900, y: 360, width: 1300, height: 60 },

                // Pontes & Rampas suspensas
                { x: 300, y: 270, width: 180, height: 18 },
                { x: 550, y: 200, width: 200, height: 18 },
                { x: 1100, y: 270, width: 160, height: 18 },
                { x: 1350, y: 200, width: 180, height: 18 },
                { x: 1600, y: 140, width: 180, height: 18 },
                { x: 2000, y: 270, width: 220, height: 18 },
                { x: 2350, y: 200, width: 200, height: 18 },
                { x: 2650, y: 270, width: 250, height: 18 }
            ];

            // Criando Coletáveis (Moedas de Nitro / Pontos)
            coins = [
                { x: 350, y: 230, collected: false },
                { x: 400, y: 230, collected: false },
                { x: 600, y: 160, collected: false },
                { x: 650, y: 160, collected: false },
                { x: 950, y: 320, collected: false }, // Sobre o buraco
                { x: 1150, y: 230, collected: false },
                { x: 1400, y: 160, collected: false },
                { x: 1680, y: 100, collected: false },
                { x: 2050, y: 230, collected: false },
                { x: 2120, y: 230, collected: false },
                { x: 2400, y: 160, collected: false },
                { x: 2750, y: 230, collected: false }
            ];

            // Criando Obstáculos (Inimigos/Carros rivais e Spikes)
            obstacles = [
                // Carro Rival (Patrulha)
                { x: 450, y: 340, width: 45, height: 20, vx: 2, minX: 400, maxX: 750, type: 'car' },
                { x: 1200, y: 340, width: 45, height: 20, vx: 2.5, minX: 1050, maxX: 1600, type: 'car' },
                { x: 2100, y: 340, width: 45, height: 20, vx: 3, minX: 1950, maxX: 2500, type: 'car' },

                // Manchas de Óleo / Obstáculos estáticos
                { x: 600, y: 192, width: 30, height: 8, type: 'oil' },
                { x: 1420, y: 192, width: 30, height: 8, type: 'oil' },
                { x: 2420, y: 192, width: 30, height: 8, type: 'oil' }
            ];
        }

        // ==========================================
        // LÓGICA PRINCIPAL (UPDATE)
        // ==========================================

        function update() {
            if (gameOver) return;

            player.update();

            // Colisão com Plataformas
            player.grounded = false;
            platforms.forEach(plat => {
                if (
                    player.x < plat.x + plat.width &&
                    player.x + player.width > plat.x &&
                    player.y + player.height >= plat.y &&
                    player.y + player.height <= plat.y + plat.height + 10 &&
                    player.vy >= 0
                ) {
                    player.grounded = true;
                    player.vy = 0;
                    player.y = plat.y - player.height;
                }
            });

            // Queda em buracos (Fosseis da pista)
            if (player.y > canvas.height + 50) {
                takeDamage(true);
            }

            // Coleta de Moedas/Nitro
            coins.forEach(coin => {
                if (!coin.collected) {
                    let cx = player.x + player.width / 2;
                    let cy = player.y + player.height / 2;
                    let dist = Math.hypot(cx - coin.x, cy - coin.y);

                    if (dist < player.width / 2 + 10) {
                        coin.collected = true;
                        score += 50;
                        scoreText.textContent = score;
                    }
                }
            });

            // Atualizar e verificar Obstáculos
            obstacles.forEach(obs => {
                if (obs.type === 'car') {
                    obs.x += obs.vx;
                    if (obs.x <= obs.minX || obs.x + obs.width >= obs.maxX) {
                        obs.vx *= -1; // Inverte direção
                    }
                }

                // Checagem de Colisão com o Jogador
                if (
                    !player.invulnerable &&
                    player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y
                ) {
                    takeDamage(false);
                }
            });

            // Linha de Chegada (Condição de Vitória)
            if (player.x + player.width >= finishLine.x) {
                endGame(true);
            }

            // Atualização do acompanhamento da câmera
            cameraX = player.x - 150;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > LEVEL_WIDTH - canvas.width) cameraX = LEVEL_WIDTH - canvas.width;
        }

        function takeDamage(instantFall) {
            lives--;
            updateLivesUI();

            if (lives <= 0) {
                endGame(false);
            } else {
                // Respawn / Recuo do jogador
                player.invulnerable = true;
                player.invulnerableTimer = 90; // ~1.5 segundos de imunidade
                player.x = Math.max(60, player.x - 150);
                player.y = 200;
                player.vy = 0;
            }
        }

        function updateLivesUI() {
            let hearts = "";
            for (let i = 0; i < lives; i++) hearts += "❤️";
            livesText.textContent = hearts || "💀";
        }

        function endGame(isWin) {
            gameOver = true;
            overlay.classList.remove("hidden");

            if (isWin) {
                overlayTitle.textContent = "VITÓRIA!";
                overlayTitle.className = "win-title";
                overlayDesc.textContent = `Sensacional! Pontuação final: ${score} pontos.`;
            } else {
                overlayTitle.textContent = "GAME OVER!";
                overlayTitle.className = "lose-title";
                overlayDesc.textContent = "Seu veículo foi destruído no circuito.";
            }
        }

        function restartGame() {
            score = 0;
            lives = 3;
            gameOver = false;
            scoreText.textContent = score;
            updateLivesUI();
            player.reset();
            initLevel();
            overlay.classList.add("hidden");
            
            cancelAnimationFrame(animationId);
            gameLoop();
        }

        // ==========================================
        // RENDERIZAÇÃO GRÁFICA (DRAW)
        // ==========================================

        function draw() {
            // Limpar Tela
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Desenhar Cenário / Cidade ao Fundo (Parallax Simples)
            ctx.fillStyle = "#152238";
            for (let i = 0; i < 15; i++) {
                let bgX = (i * 250) - cameraX * 0.3;
                ctx.fillRect(bgX, 150, 120, 250);
            }

            // 2. Desenhar Plataformas / Pistas de Asfalto
            platforms.forEach(plat => {
                let drawX = plat.x - cameraX;

                // Desenha a estrutura da pista
                ctx.fillStyle = "#2c3e50";
                ctx.fillRect(drawX, plat.y, plat.width, plat.height);

                // Topo Amarelo (Guia de Corrida)
                ctx.fillStyle = "#ffbd59";
                ctx.fillRect(drawX, plat.y, plat.width, 4);
            });

            // 3. Desenhar Moedas de Nitro (Amarelo brilhante)
            coins.forEach(coin => {
                if (!coin.collected) {
                    let drawX = coin.x - cameraX;
                    ctx.beginPath();
                    ctx.arc(drawX, coin.y, 8, 0, Math.PI * 2);
                    ctx.fillStyle = "#ffbd59";
                    ctx.fill();
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "#ffbd59";
                    ctx.closePath();
                    ctx.shadowBlur = 0; // Reseta o brilho
                }
            });

            // 4. Desenhar Obstáculos
            obstacles.forEach(obs => {
                let drawX = obs.x - cameraX;

                if (obs.type === 'car') {
                    // Carro Inimigo (Rival Roxo)
                    ctx.fillStyle = "#9c27b0";
                    ctx.beginPath();
                    ctx.roundRect(drawX, obs.y, obs.width, obs.height, [3]);
                    ctx.fill();

                    // Vidro do Inimigo
                    ctx.fillStyle = "#111";
                    ctx.fillRect(drawX + 8, obs.y + 2, 15, 6);
                } else if (obs.type === 'oil') {
                    // Poça de Óleo
                    ctx.fillStyle = "#000";
                    ctx.beginPath();
                    ctx.ellipse(drawX + obs.width/2, obs.y + obs.height/2, obs.width/2, obs.height/2, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // 5. Linha de Chegada (Bandeira Quadriculada)
            let finishDrawX = finishLine.x - cameraX;
            ctx.fillStyle = "#fff";
            ctx.fillRect(finishDrawX, 0, 20, canvas.height);
            ctx.fillStyle = "#000";
            for (let y = 0; y < canvas.height; y += 20) {
                ctx.fillRect(finishDrawX + (y % 40 === 0 ? 0 : 10), y, 10, 10);
            }

            // 6. Desenhar Jogador
            player.draw(cameraX);
        }

        // ==========================================
        // GAME LOOP (Ciclo de Animação)
        // ==========================================

        function gameLoop() {
            update();
            draw();
            if (!gameOver) {
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        // Inicializar o primeiro jogo ao carregar
        initLevel();
        gameLoop();
    </script>
</body>
</html>
