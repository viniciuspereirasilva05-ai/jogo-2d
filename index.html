<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monster Truck: Fuga do Vulcão</title>

  <!-- ===================================================================== -->
  <!-- 1. ESTILOS VISUAIS DA PÁGINA (CSS)                                    -->
  <!-- ===================================================================== -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #2a0a0a, #090507 80%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container-jogo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      max-width: 820px;
      width: 100%;
    }

    h1 {
      font-size: 1.75rem;
      color: #fb923c;
      text-shadow: 0 0 14px rgba(234, 88, 12, 0.7);
      letter-spacing: 0.5px;
    }

    /* Barra superior com Pontos, Barras de Ouro e Vidas */
    .painel-status {
      width: 800px;
      max-width: 100%;
      background-color: #1c1010;
      border: 2px solid #7c2d12;
      border-radius: 10px;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      font-size: 1.05rem;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    /* Área principal do jogo */
    .area-canvas {
      position: relative;
      width: 800px;
      max-width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(234, 88, 12, 0.25);
      border: 3px solid #ea580c;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background-color: #1a0707;
    }

    /* Tela sobreposta de Vitória ou Derrota */
    .tela-final {
      position: absolute;
      inset: 0;
      background-color: rgba(12, 5, 5, 0.88);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .tela-final.oculto {
      display: none;
    }

    .caixa-mensagem {
      background-color: #1f1212;
      border: 2px solid #f97316;
      border-radius: 14px;
      padding: 28px 36px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
    }

    .caixa-mensagem h2 {
      font-size: 1.9rem;
      margin-bottom: 10px;
    }

    .caixa-mensagem p {
      font-size: 1.02rem;
      color: #e2e8f0;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .pontuacao-final {
      font-size: 1.25rem;
      color: #facc15 !important;
      margin-bottom: 20px !important;
    }

    #btnReiniciar {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px 26px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.4);
    }

    #btnReiniciar:hover {
      filter: brightness(1.15);
      transform: scale(1.05);
    }

    #btnReiniciar:active {
      transform: scale(0.98);
    }

    /* Barra inferior de controles */
    .controles-info {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      font-size: 0.9rem;
      color: #fed7aa;
      background-color: #1c1010;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #7c2d12;
    }
  </style>
</head>
<body>

  <!-- ===================================================================== -->
  <!-- 2. ESTRUTURA HTML DO JOGO                                             -->
  <!-- ===================================================================== -->
  <main class="container-jogo">
    <!-- Título do jogo (personalize aqui!) -->
    <h1 id="tituloJogo">🌋 Monster Truck: Fuga do Vulcão</h1>

    <!-- Placar superior -->
    <header class="painel-status">
      <div class="status-item">🔥 Pontos: <span id="valorPontos">0</span></div>
      <div class="status-item">🥇 Barras de Ouro: <span id="valorOuro">0/15</span></div>
      <div class="status-item">❤️ Vidas: <span id="valorVidas">3</span></div>
    </header>

    <!-- Canvas + Tela de Fim de Jogo -->
    <div class="area-canvas">
      <canvas id="jogoCanvas" width="800" height="450"></canvas>

      <div id="telaFinal" class="tela-final oculto">
        <div class="caixa-mensagem">
          <h2 id="tituloFinal">Fim de Jogo!</h2>
          <p id="textoFinal">Seu carro monstro foi destruído.</p>
          <p class="pontuacao-final">Pontuação Final: <strong id="pontosFinais">0</strong></p>
          <button id="btnReiniciar" type="button">🔄 Jogar Novamente</button>
        </div>
      </div>
    </div>

    <!-- Instruções -->
    <footer class="controles-info">
      <span><strong>Acelerar / Ré:</strong> Setas ◀ ▶ ou A / D</span>
      <span>•</span>
      <span><strong>Pular:</strong> Espaço (ou W / ▲)</span>
      <span>•</span>
      <span><strong>Missão:</strong> Esmague os carros vermelhos e derrote o Chefe Gigante no final!</span>
    </footer>
  </main>

  <!-- ===================================================================== -->
  <!-- 3. CÓDIGO DO JOGO (JAVASCRIPT PURO)                                   -->
  <!-- ===================================================================== -->
  <script>
    // ========================================================================
    // ÁREA DE PERSONALIZAÇÃO (MUDE AQUI PARA CUSTOMIZAR O JOGO!)
    // ========================================================================
    const CONFIG = {
      // Física do Carro Monstro
      velocidadeCarro: 6.2,     // Velocidade horizontal do carro
      forcaPulo: -14.5,         // Força do pulo (quanto mais negativo, mais alto)
      gravidade: 0.62,          // Gravidade puxando o carro para baixo

      // Tamanho da Pista e Regras
      larguraMundo: 3200,       // Comprimento total da fase em pixels
      posicaoChegada: 3060,     // Posição X da linha de chegada
      vidasIniciais: 3,         // Vidas ao iniciar
      vidaChefeInicial: 3,      // Quantos pulos no teto são necessários para vencer o Chefe

      // Pontuação
      pontosPorBarraOuro: 100,
      pontosPorInimigo: 150,
      pontosPorDerrotarChefe: 500,
      bonusTodasBarras: 300,

      // Cores dos Carros e Cenário
      corCarroJogador: "#2563eb",   // Azul metálico
      corDetalheJogador: "#60a5fa", // Azul claro
      corCarroInimigo: "#dc2626",   // Vermelho
      corCarroVilao: "#18181b",     // Preto blindado (Chefe)
      corRocha: "#291d1e",          // Rocha vulcânica
      corLava: "#ea580c"            // Lava brilhante
    };

    // ========================================================================
    // CONEXÃO COM OS ELEMENTOS HTML
    // ========================================================================
    const canvas = document.getElementById("jogoCanvas");
    const ctx = canvas.getContext("2d");

    const elPontos = document.getElementById("valorPontos");
    const elOuro = document.getElementById("valorOuro");
    const elVidas = document.getElementById("valorVidas");

    const telaFinal = document.getElementById("telaFinal");
    const tituloFinal = document.getElementById("tituloFinal");
    const textoFinal = document.getElementById("textoFinal");
    const pontosFinais = document.getElementById("pontosFinais");
    const btnReiniciar = document.getElementById("btnReiniciar");

    // ========================================================================
    // VARIÁVEIS DE ESTADO DO JOGO
    // ========================================================================
    let pontos = 0;
    let vidas = CONFIG.vidasIniciais;
    let jogoEncerrado = false;
    let cameraX = 0;
    let tremorTela = 0;
    let mensagemAviso = "";
    let tempoAviso = 0;

    // Carro Monstro do Jogador
    const jogador = {
      x: 70,
      y: 340,
      largura: 64,
      altura: 44,
      velX: 0,
      velY: 0,
      noChao: false,
      direcao: 1,
      anguloRoda: 0,
      invencivel: 0
    };

    // Carro Monstro Vilão Gigante (Chefe no final da pista)
    const chefeVilao = {
      x: 2840,
      y: 292,
      largura: 168,
      altura: 118,
      velX: -1.4,
      minX: 2740,
      maxX: 2940,
      hp: CONFIG.vidaChefeInicial,
      vivo: true,
      invencivel: 0,
      anguloRoda: 0
    };

    // Chão e Plataformas de Rocha Vulcânica
    const plataformas = [
      { x: 0,    y: 410, largura: 3200, altura: 40 }, // Estrada principal
      { x: 260,  y: 320, largura: 170,  altura: 20 },
      { x: 540,  y: 255, largura: 170,  altura: 20 },
      { x: 860,  y: 315, largura: 190,  altura: 20 },
      { x: 1180, y: 245, largura: 180,  altura: 20 },
      { x: 1520, y: 310, largura: 200,  altura: 20 },
      { x: 1850, y: 240, largura: 180,  altura: 20 },
      { x: 2180, y: 305, largura: 190,  altura: 20 },
      { x: 2500, y: 255, largura: 190,  altura: 20 }  // Plataforma de apoio perto do Chefe
    ];

    // Poças de Lava e Espinhos Vulcânicos na estrada
    const perigosLava = [
      { x: 460,  y: 398, largura: 70, altura: 12 },
      { x: 1080, y: 398, largura: 80, altura: 12 },
      { x: 1750, y: 398, largura: 85, altura: 12 },
      { x: 2390, y: 398, largura: 80, altura: 12 }
    ];

    // Partículas do Vulcão (brasas e bolas de lava)
    let brasas = [];
    let bolasLava = [];
    let tempoProximoJato = 0;

    // Listas dinâmicas
    let barrasOuro = [];
    let inimigos = [];

    // ========================================================================
    // CONTROLES DO TECLADO
    // ========================================================================
    const teclas = {
      esquerda: false,
      direita: false
    };

    window.addEventListener("keydown", (evento) => {
      const tecla = evento.key.toLowerCase();

      if (tecla === "arrowleft" || tecla === "a") teclas.esquerda = true;
      if (tecla === "arrowright" || tecla === "d") teclas.direita = true;

      if (evento.code === "Space" || tecla === "arrowup" || tecla === "w") {
        evento.preventDefault();
        if (jogador.noChao && !jogoEncerrado) {
          jogador.velY = CONFIG.forcaPulo;
          jogador.noChao = false;
        }
      }
    });

    window.addEventListener("keyup", (evento) => {
      const tecla = evento.key.toLowerCase();

      if (tecla === "arrowleft" || tecla === "a") teclas.esquerda = false;
      if (tecla === "arrowright" || tecla === "d") teclas.direita = false;
    });

    // ========================================================================
    // INICIALIZAÇÃO E REINÍCIO DO JOGO
    // ========================================================================
    function iniciarJogo() {
      pontos = 0;
      vidas = CONFIG.vidasIniciais;
      jogoEncerrado = false;
      cameraX = 0;
      tremorTela = 0;
      mensagemAviso = "";
      tempoAviso = 0;

      // Reseta jogador
      jogador.x = 70;
      jogador.y = 340;
      jogador.velX = 0;
      jogador.velY = 0;
      jogador.noChao = false;
      jogador.direcao = 1;
      jogador.anguloRoda = 0;
      jogador.invencivel = 0;

      // Reseta Carro Monstro Vilão Gigante
      chefeVilao.x = 2840;
      chefeVilao.y = 292;
      chefeVilao.velX = -1.4;
      chefeVilao.hp = CONFIG.vidaChefeInicial;
      chefeVilao.vivo = true;
      chefeVilao.invencivel = 0;

      // Cria 15 Barras de Ouro espalhadas pela fase
      barrasOuro = [
        { x: 300,  y: 285, coletada: false },
        { x: 370,  y: 285, coletada: false },
        { x: 585,  y: 220, coletada: false },
        { x: 645,  y: 220, coletada: false },
        { x: 770,  y: 375, coletada: false },
        { x: 920,  y: 280, coletada: false },
        { x: 990,  y: 280, coletada: false },
        { x: 1240, y: 210, coletada: false },
        { x: 1300, y: 210, coletada: false },
        { x: 1580, y: 275, coletada: false },
        { x: 1650, y: 275, coletada: false },
        { x: 1910, y: 205, coletada: false },
        { x: 2240, y: 270, coletada: false },
        { x: 2550, y: 220, coletada: false },
        { x: 2620, y: 220, coletada: false }
      ];

      // Cria Carros Monstros Vermelhos (inimigos)
      inimigos = [
        { x: 620,  y: 368, largura: 58, altura: 42, velX: -2.2, minX: 550,  maxX: 830,  vivo: true, anguloRoda: 0 },
        { x: 900,  y: 273, largura: 54, altura: 42, velX: 1.8,  minX: 865,  maxX: 1040, vivo: true, anguloRoda: 0 },
        { x: 1320, y: 368, largura: 58, altura: 42, velX: -2.6, minX: 1190, maxX: 1500, vivo: true, anguloRoda: 0 },
        { x: 1960, y: 368, largura: 58, altura: 42, velX: -2.8, minX: 1860, maxX: 2160, vivo: true, anguloRoda: 0 },
        { x: 2210, y: 263, largura: 54, altura: 42, velX: 2.0,  minX: 2185, maxX: 2360, vivo: true, anguloRoda: 0 }
      ];

      // Cria brasas iniciais flutuando no ar
      brasas = [];
      for (let i = 0; i < 45; i++) {
        brasas.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          raio: 1.5 + Math.random() * 2.5,
          velY: -0.6 - Math.random() * 1.4,
          velX: (Math.random() - 0.5) * 0.8
        });
      }

      bolasLava = [];
      tempoProximoJato = 40;

      telaFinal.classList.add("oculto");
      btnReiniciar.blur();
      atualizarHUD();
    }

    btnReiniciar.addEventListener("click", iniciarJogo);

    function atualizarHUD() {
      const coletadas = barrasOuro.filter((b) => b.coletada).length;
      elPontos.textContent = pontos;
      elOuro.textContent = `${coletadas}/${barrasOuro.length}`;
      elVidas.textContent = vidas;
    }

    function mostrarAviso(texto) {
      mensagemAviso = texto;
      tempoAviso = 130;
    }

    // ========================================================================
    // LÓGICA, FÍSICA E COLISÕES
    // ========================================================================
    function verificarColisao(a, b) {
      return (
        a.x < b.x + b.largura &&
        a.x + a.largura > b.x &&
        a.y < b.y + b.altura &&
        a.y + a.altura > b.y
      );
    }

    function sofrerDano(mensagem = "Cuidado! Seu carro sofreu dano!") {
      if (jogador.invencivel > 0) return;

      vidas--;
      tremorTela = 12;
      atualizarHUD();

      if (vidas <= 0) {
        finalizarJogo(false);
      } else {
        jogador.invencivel = 90;
        jogador.velY = -8;
        mostrarAviso(mensagem);
      }
    }

    function finalizarJogo(venceu) {
      jogoEncerrado = true;

      if (venceu) {
        const todasColetadas = barrasOuro.every((b) => b.coletada);
        let msgExtra = "Você derrotou o Carro Monstro Gigante e escapou do vulcão!";
        if (todasColetadas) {
          pontos += CONFIG.bonusTodasBarras;
          msgExtra += ` Bônus de +${CONFIG.bonusTodasBarras} pts por pegar todas as barras de ouro!`;
        }
        atualizarHUD();
        tituloFinal.textContent = "🏆 Vitória Épica!";
        tituloFinal.style.color = "#4ade80";
        textoFinal.textContent = msgExtra;
      } else {
        tituloFinal.textContent = "💥 Carro Destruído!";
        tituloFinal.style.color = "#f87171";
        textoFinal.textContent = "A lava e os carros monstros venceram desta vez. Tente novamente!";
      }

      pontosFinais.textContent = pontos;
      telaFinal.classList.remove("oculto");
    }

    function atualizarErupcaoVulcao() {
      // Atualiza brasas flutuantes
      for (const brasa of brasas) {
        brasa.y += brasa.velY;
        brasa.x += brasa.velX;
        if (brasa.y < 0) {
          brasa.y = canvas.height;
          brasa.x = Math.random() * canvas.width;
        }
      }

      // Dispara bolas de lava da cratera do vulcão de fundo
      tempoProximoJato--;
      if (tempoProximoJato <= 0) {
        tempoProximoJato = 35 + Math.floor(Math.random() * 45);
        for (let i = 0; i < 3; i++) {
          bolasLava.push({
            x: 430 + (Math.random() - 0.5) * 30, // Cratera do vulcão no fundo
            y: 118,
            velX: (Math.random() - 0.5) * 6.5,
            velY: -4.5 - Math.random() * 4.5,
            raio: 4 + Math.random() * 4,
            vida: 110
          });
        }
      }

      for (let i = bolasLava.length - 1; i >= 0; i--) {
        const bola = bolasLava[i];
        bola.x += bola.velX;
        bola.y += bola.velY;
        bola.velY += 0.22; // Gravidade da lava
        bola.vida--;
        if (bola.vida <= 0 || bola.y > canvas.height) {
          bolasLava.splice(i, 1);
        }
      }
    }

    function atualizar() {
      atualizarErupcaoVulcao();
      if (jogoEncerrado) return;

      if (jogador.invencivel > 0) jogador.invencivel--;
      if (tempoAviso > 0) tempoAviso--;
      if (tremorTela > 0) tremorTela--;

      // --- Movimento Horizontal do Carro Monstro ---
      jogador.velX = 0;
      if (teclas.esquerda) {
        jogador.velX = -CONFIG.velocidadeCarro;
        jogador.direcao = -1;
      }
      if (teclas.direita) {
        jogador.velX = CONFIG.velocidadeCarro;
        jogador.direcao = 1;
      }

      jogador.x += jogador.velX;
      jogador.anguloRoda += jogador.velX * 0.08;

      // Limites da pista
      if (jogador.x < 0) jogador.x = 0;
      if (jogador.x + jogador.largura > CONFIG.larguraMundo) {
        jogador.x = CONFIG.larguraMundo - jogador.largura;
      }

      // Colisão lateral com plataformas
      for (const plat of plataformas) {
        if (verificarColisao(jogador, plat)) {
          if (jogador.velX > 0) jogador.x = plat.x - jogador.largura;
          if (jogador.velX < 0) jogador.x = plat.x + plat.largura;
        }
      }

      // --- Movimento Vertical e Gravidade ---
      jogador.velY += CONFIG.gravidade;
      jogador.noChao = false;
      jogador.y += jogador.velY;

      for (const plat of plataformas) {
        if (verificarColisao(jogador, plat)) {
          if (jogador.velY > 0) {
            jogador.y = plat.y - jogador.altura;
            jogador.velY = 0;
            jogador.noChao = true;
          } else if (jogador.velY < 0) {
            jogador.y = plat.y + plat.altura;
            jogador.velY = 0;
          }
        }
      }

      // Atualiza Câmera (mantém o carro visível à esquerda da tela)
      cameraX = jogador.x - 240;
      if (cameraX < 0) cameraX = 0;
      if (cameraX > CONFIG.larguraMundo - canvas.width) {
        cameraX = CONFIG.larguraMundo - canvas.width;
      }

      // --- Coleta das Barras de Ouro ---
      for (const barra of barrasOuro) {
        if (barra.coletada) continue;
        const areaBarra = { x: barra.x, y: barra.y, largura: 30, altura: 18 };
        if (verificarColisao(jogador, areaBarra)) {
          barra.coletada = true;
          pontos += CONFIG.pontosPorBarraOuro;
          atualizarHUD();
        }
      }

      // --- Carros Monstros Vermelhos (Inimigos) ---
      for (const inimigo of inimigos) {
        if (!inimigo.vivo) continue;

        inimigo.x += inimigo.velX;
        inimigo.anguloRoda += inimigo.velX * 0.08;

        if (inimigo.x <= inimigo.minX || inimigo.x + inimigo.largura >= inimigo.maxX) {
          inimigo.velX *= -1;
        }

        if (verificarColisao(jogador, inimigo)) {
          const rodasAnteriores = jogador.y + jogador.altura - jogador.velY;
          if (jogador.velY > 0 && rodasAnteriores <= inimigo.y + inimigo.altura * 0.55) {
            inimigo.vivo = false;
            jogador.velY = -11;
            tremorTela = 8;
            pontos += CONFIG.pontosPorInimigo;
            atualizarHUD();
          } else {
            sofrerDano("Bateu em um Carro Monstro Vermelho!");
          }
        }
      }

      // --- Perigos de Lava na Estrada ---
      for (const lava of perigosLava) {
        if (verificarColisao(jogador, lava)) {
          sofrerDano("Cuidado com a lava fervente!");
        }
      }

      // --- Carro Monstro Vilão Gigante (Chefe Final) ---
      if (chefeVilao.vivo) {
        if (chefeVilao.invencivel > 0) chefeVilao.invencivel--;

        chefeVilao.x += chefeVilao.velX;
        chefeVilao.anguloRoda += chefeVilao.velX * 0.04;
        if (chefeVilao.x <= chefeVilao.minX || chefeVilao.x + chefeVilao.largura >= chefeVilao.maxX) {
          chefeVilao.velX *= -1;
        }

        if (verificarColisao(jogador, chefeVilao)) {
          const rodasAnteriores = jogador.y + jogador.altura - jogador.velY;
          // Se pular no teto do Chefe Gigante
          if (jogador.velY > 0 && rodasAnteriores <= chefeVilao.y + chefeVilao.altura * 0.45) {
            jogador.velY = -13; // Quica bem alto
            if (chefeVilao.invencivel === 0) {
              chefeVilao.hp--;
              chefeVilao.invencivel = 45;
              tremorTela = 16;

              if (chefeVilao.hp <= 0) {
                chefeVilao.vivo = false;
                pontos += CONFIG.pontosPorDerrotarChefe;
                atualizarHUD();
                mostrarAviso("BOOOOM! Você destruiu o Vilão Gigante! Cruze a chegada!");
              } else {
                mostrarAviso(`Acerto direto! Faltam ${chefeVilao.hp} golpes no Vilão Gigante!`);
              }
            }
          } else {
            sofrerDano("O Carro Monstro Gigante te esmagou!");
          }
        }
      }

      // --- Linha de Chegada ---
      if (jogador.x + jogador.largura >= CONFIG.posicaoChegada) {
        if (chefeVilao.vivo) {
          jogador.x = CONFIG.posicaoChegada - jogador.largura - 5;
          mostrarAviso("Derrote o Carro Monstro Vilão Gigante antes de cruzar!");
        } else {
          finalizarJogo(true);
        }
      }
    }

    // ========================================================================
    // DESENHO DOS GRÁFICOS NO CANVAS
    // ========================================================================
    function desenharFundoVulcao() {
      // Céu vulcânico escuro e incandescente
      const gradCeu = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradCeu.addColorStop(0, "#0c0404");
      gradCeu.addColorStop(0.55, "#450a0a");
      gradCeu.addColorStop(1, "#9a3412");
      ctx.fillStyle = gradCeu;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Montanhas vulcânicas distantes (efeito parallax lento)
      ctx.fillStyle = "#1f0909";
      for (let i = 0; i < 6; i++) {
        const picoX = i * 240 - ((cameraX * 0.12) % 240);
        ctx.beginPath();
        ctx.moveTo(picoX - 100, 410);
        ctx.lineTo(picoX + 70, 190);
        ctx.lineTo(picoX + 240, 410);
        ctx.closePath();
        ctx.fill();
      }

      // GRANDE VULCÃO PRINCIPAL JOGANDO LAVA PRA FORA (parallax suave)
      const vx = 430 - cameraX * 0.06;
      // Cone do vulcão
      ctx.fillStyle = "#180808";
      ctx.beginPath();
      ctx.moveTo(vx - 260, 410);
      ctx.lineTo(vx - 45, 115);
      ctx.lineTo(vx + 45, 115);
      ctx.lineTo(vx + 260, 410);
      ctx.closePath();
      ctx.fill();

      // Brilho da cratera no topo
      const brilhoCratera = ctx.createRadialGradient(vx, 115, 5, vx, 115, 75);
      brilhoCratera.addColorStop(0, "#fef08a");
      brilhoCratera.addColorStop(0.4, "#f97316");
      brilhoCratera.addColorStop(1, "rgba(234, 88, 12, 0)");
      ctx.fillStyle = brilhoCratera;
      ctx.beginPath();
      ctx.arc(vx, 115, 75, 0, Math.PI * 2);
      ctx.fill();

      // Rios de lava escorrendo pela encosta do vulcão
      ctx.strokeStyle = "#f97316";
      ctx.lineWidth = 7;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(vx - 20, 118);
      ctx.quadraticCurveTo(vx - 55, 220, vx - 125, 360);
      ctx.moveTo(vx + 15, 118);
      ctx.quadraticCurveTo(vx + 65, 210, vx + 135, 380);
      ctx.stroke();

      ctx.strokeStyle = "#facc15";
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Bolas de lava sendo cuspidas pelo vulcão
      for (const bola of bolasLava) {
        const bx = bola.x - cameraX * 0.06;
        ctx.fillStyle = "#facc15";
        ctx.beginPath();
        ctx.arc(bx, bola.y, bola.raio, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(239, 68, 68, 0.55)";
        ctx.beginPath();
        ctx.arc(bx, bola.y, bola.raio * 1.8, 0, Math.PI * 2);
        ctx.fill();
      }

      // Brasas flutuantes no ar
      for (const brasa of brasas) {
        ctx.fillStyle = "rgba(251, 146, 60, 0.8)";
        ctx.beginPath();
        ctx.arc(brasa.x, brasa.y, brasa.raio, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Função para desenhar Carros Monstros (Jogador e Inimigos Vermelhos)
    function desenharCarroMonstro(x, y, largura, altura, corPrincipal, corDetalhe, direcao, anguloRoda) {
      ctx.save();

      // Suspensão / Amortecedores
      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x + 14, y + altura - 14);
      ctx.lineTo(x + 14, y + altura - 4);
      ctx.moveTo(x + largura - 14, y + altura - 14);
      ctx.lineTo(x + largura - 14, y + altura - 4);
      ctx.stroke();

      // Lataria da picape Monster Truck
      ctx.fillStyle = corPrincipal;
      ctx.beginPath();
      ctx.roundRect(x + 4, y + 12, largura - 8, altura - 22, 6);
      ctx.fill();

      // Cabine superior
      const cabineX = direcao === 1 ? x + 12 : x + 20;
      ctx.fillStyle = corPrincipal;
      ctx.beginPath();
      ctx.roundRect(cabineX, y + 2, largura - 32, 14, 4);
      ctx.fill();

      // Vidro da cabine
      ctx.fillStyle = "#bae6fd";
      const vidroX = direcao === 1 ? cabineX + (largura - 32) - 12 : cabineX + 2;
      ctx.fillRect(vidroX, y + 4, 10, 8);

      // Faixa decorativa lateral
      ctx.fillStyle = corDetalhe;
      ctx.fillRect(x + 8, y + 18, largura - 16, 4);

      // Rodas gigantes com calotas giratórias
      const raioRoda = 11;
      const posRodas = [x + 14, x + largura - 14];
      const rodaY = y + altura - 8;

      for (const rx of posRodas) {
        // Pneu
        ctx.fillStyle = "#09090b";
        ctx.beginPath();
        ctx.arc(rx, rodaY, raioRoda, 0, Math.PI * 2);
        ctx.fill();

        // Aro metálico
        ctx.fillStyle = "#cbd5e1";
        ctx.beginPath();
        ctx.arc(rx, rodaY, 5, 0, Math.PI * 2);
        ctx.fill();

        // Raio girando para dar sensação de velocidade
        ctx.strokeStyle = "#334155";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(rx + Math.cos(anguloRoda) * 5, rodaY + Math.sin(anguloRoda) * 5);
        ctx.lineTo(rx - Math.cos(anguloRoda) * 5, rodaY - Math.sin(anguloRoda) * 5);
        ctx.stroke();
      }

      ctx.restore();
    }
