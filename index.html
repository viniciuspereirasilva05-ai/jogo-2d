<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monster Truck 2D - Corrida do Ouro</title>

  <!-- ===================================================================== -->
  <!-- 1. ESTILOS VISUAIS DA PÁGINA (CSS)                                    -->
  <!-- ===================================================================== -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .container-jogo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 820px;
      width: 100%;
    }

    h1 {
      font-size: 1.8rem;
      color: #facc15;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    /* Barra superior com Pontos, Barras de Ouro e Vidas */
    .painel-status {
      width: 800px;
      max-width: 100%;
      background-color: #1e293b;
      border: 2px solid #334155;
      border-radius: 10px;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.1rem;
      font-weight: bold;
    }

    /* Moldura do Canvas */
    .area-canvas {
      position: relative;
      width: 800px;
      max-width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
      border: 3px solid #facc15;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background-color: #7dd3fc;
      cursor: pointer;
    }

    /* Tela sobreposta de Vitória ou Derrota */
    .tela-final {
      position: absolute;
      inset: 0;
      background-color: rgba(15, 23, 42, 0.88);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      z-index: 10;
    }

    .tela-final.oculto {
      display: none;
    }

    .caixa-mensagem {
      background-color: #1e293b;
      border: 2px solid #facc15;
      border-radius: 14px;
      padding: 26px 34px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    }

    .caixa-mensagem h2 {
      font-size: 1.9rem;
      margin-bottom: 10px;
    }

    .caixa-mensagem p {
      font-size: 1.02rem;
      color: #cbd5e1;
      margin-bottom: 12px;
      line-height: 1.45;
    }

    .pontuacao-final {
      font-size: 1.25rem;
      color: #facc15 !important;
      margin-bottom: 20px !important;
    }

    #btnReiniciar {
      background-color: #22c55e;
      color: #052e16;
      border: none;
      border-radius: 8px;
      padding: 12px 26px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    #btnReiniciar:hover {
      background-color: #4ade80;
      transform: scale(1.05);
    }

    #btnReiniciar:active {
      transform: scale(0.98);
    }

    /* Barra inferior com instruções */
    .controles-info {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      font-size: 0.92rem;
      color: #cbd5e1;
      background-color: #1e293b;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      text-align: center;
    }

    /* Botões táteis para celulares/tablets */
    .controles-touch {
      display: none;
      width: 100%;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
    }

    .grupo-direcional {
      display: flex;
      gap: 12px;
    }

    .btn-touch {
      background-color: #1e293b;
      color: #facc15;
      border: 2px solid #facc15;
      border-radius: 12px;
      padding: 14px 22px;
      font-size: 1.2rem;
      font-weight: bold;
      user-select: none;
      touch-action: manipulation;
    }

    .btn-touch:active {
      background-color: #facc15;
      color: #0f172a;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.35rem;
      }
      .painel-status {
        font-size: 0.95rem;
        padding: 8px 12px;
      }
      .controles-touch {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <!-- ===================================================================== -->
  <!-- 2. ESTRUTURA DA PÁGINA (HTML)                                         -->
  <!-- ===================================================================== -->
  <main class="container-jogo">
    <!-- Título do jogo (personalize aqui!) -->
    <h1 id="tituloJogo">🚙 Monster Truck 2D: Corrida do Ouro</h1>

    <!-- Placar superior -->
    <header class="painel-status">
      <div class="status-item">⭐ Pontos: <span id="valorPontos">0</span></div>
      <div class="status-item">🟨 Barras de Ouro: <span id="valorOuro">0/15</span></div>
      <div class="status-item">❤️ Vidas: <span id="valorVidas">3</span></div>
    </header>

    <!-- Área do Canvas 800x450 e Tela Final -->
    <div class="area-canvas">
      <canvas id="jogoCanvas" width="800" height="450"></canvas>

      <!-- Tela de Vitória ou Derrota -->
      <div id="telaFinal" class="tela-final oculto">
        <div class="caixa-mensagem">
          <h2 id="tituloFinal">Fim de Jogo!</h2>
          <p id="textoFinal">Você perdeu todas as suas vidas.</p>
          <p class="pontuacao-final">Pontuação Final: <strong id="pontosFinais">0</strong></p>
          <button id="btnReiniciar" type="button">🔄 Jogar Novamente</button>
        </div>
      </div>
    </div>

    <!-- Controles táteis para telas pequenas -->
    <div class="controles-touch" aria-label="Controles na tela">
      <div class="grupo-direcional">
        <button id="btnEsq" class="btn-touch" type="button">◀ Ré</button>
        <button id="btnDir" class="btn-touch" type="button">Acelerar ▶</button>
      </div>
      <button id="btnPular" class="btn-touch" type="button">▲ Pular</button>
    </div>

    <!-- Instruções de controle -->
    <footer class="controles-info">
      <span><strong>Dirigir:</strong> Setas ◀ ▶ ou A / D</span>
      <span>•</span>
      <span><strong>Pular:</strong> Espaço (ou W / ▲)</span>
      <span>•</span>
      <span><strong>Dica:</strong> Esmague os carros vermelhos pulando por cima e chegue na linha quadriculada!</span>
    </footer>
  </main>

  <!-- ===================================================================== -->
  <!-- 3. LÓGICA DO JOGO (JAVASCRIPT PURO)                                   -->
  <!-- ===================================================================== -->
  <script>
    // ========================================================================
    // 1. ÁREA DE PERSONALIZAÇÃO (MUDE AQUI PARA CUSTOMIZAR SEU JOGO!)
    // ========================================================================
    const CONFIG = {
      // Dimensões da pista e câmera
      larguraFase: 3200,         // Comprimento total da pista em pixels
      posicaoChegada: 3040,      // Posição X da linha de chegada quadriculada

      // Física e movimentação do Carro Monstro
      velocidadeJogador: 5.5,    // Velocidade horizontal do carro monstro
      forcaPulo: -13.5,          // Altura do pulo (quanto mais negativo, mais alto)
      gravidade: 0.6,            // Força da gravidade que puxa o carro para baixo

      // Regras e pontuação
      vidasIniciais: 3,          // Quantidade de vidas ao iniciar a corrida
      pontosPorBarra: 100,       // Pontos ganhos por cada barra de ouro coletada
      pontosPorInimigo: 200,     // Pontos ganhos ao esmagar um carro inimigo
      bonusPorVida: 250,         // Bônus por cada vida restante ao cruzar a chegada
      bonusTodasBarras: 500,     // Bônus extra se coletar todas as 15 barras de ouro

      // Cores do cenário e dos veículos
      corCeuTopo: "#38bdf8",     // Azul celeste no topo
      corCeuBase: "#bae6fd",     // Azul claro no horizonte
      corCarroJogador: "#2563eb",// Azul vibrante do seu Monster Truck
      corFaixaJogador: "#facc15",// Faixa amarela esportiva do seu carro
      corCarroInimigo: "#dc2626",// Vermelho dos Monster Trucks inimigos
      corPlataforma: "#78350f",  // Marrom da terra
      corGrama: "#16a34a",       // Verde da grama
      corEspinho: "#475569"      // Cinza metálico dos espinhos
    };

    // ========================================================================
    // 2. CONEXÃO COM OS ELEMENTOS HTML
    // ========================================================================
    const canvas = document.getElementById("jogoCanvas");
    const ctx = canvas.getContext("2d");

    const elPontos = document.getElementById("valorPontos");
    const elOuro = document.getElementById("valorOuro");
    const elVidas = document.getElementById("valorVidas");

    const telaFinal = document.getElementById("telaFinal");
    const tituloFinal = document.getElementById("tituloFinal");
    const textoFinal = document.getElementById("textoFinal");
    const pontosFinais = document.getElementById("pontosFinais");
    const btnReiniciar = document.getElementById("btnReiniciar");

    // ========================================================================
    // 3. ESTADO DO JOGO, CÂMERA E MAPA DA PISTA (3200px)
    // ========================================================================
    let pontos = 0;
    let vidas = CONFIG.vidasIniciais;
    let jogoEncerrado = false;
    let cameraX = 0;
    let mensagemAviso = "";
    let tempoAviso = 0;

    // Personagem Principal: Carro Monstro Azul
    const jogador = {
      x: 60,
      y: 350,
      largura: 68,
      altura: 46,
      velX: 0,
      velY: 0,
      noChao: false,
      direcao: 1,       // 1 = direita, -1 = esquerda
      anguloRoda: 0,    // Controla o giro das rodas gigantes
      invencivel: 0     // Frames de invencibilidade piscando após dano
    };

    // Plataformas elevadas e chão contínuo de 3200px
    const plataformas = [
      { x: 0,    y: 405, largura: CONFIG.larguraFase, altura: 45 }, // Chão principal
      { x: 400,  y: 315, largura: 200, altura: 20 }, // Plataforma 1
      { x: 980,  y: 315, largura: 190, altura: 20 }, // Plataforma 2
      { x: 1320, y: 315, largura: 180, altura: 20 }, // Plataforma 3 (degrau)
      { x: 1560, y: 225, largura: 240, altura: 20 }, // Plataforma 4 (alta)
      { x: 2080, y: 315, largura: 280, altura: 20 }, // Plataforma 5 (larga com inimigo)
      { x: 2420, y: 230, largura: 190, altura: 20 }  // Plataforma 6 (alta final)
    ];

    // Barreiras de espinhos no chão ao longo da pista
    const espinhos = [
      { x: 1045, y: 389, largura: 54, altura: 16 },
      { x: 1880, y: 389, largura: 54, altura: 16 },
      { x: 2660, y: 389, largura: 54, altura: 16 }
    ];

    // Nuvens espalhadas pelo céu (usam parallax)
    const nuvens = [
      { x: 120,  y: 65, escala: 1.0 },
      { x: 450,  y: 45, escala: 0.85 },
      { x: 820,  y: 75, escala: 1.15 },
      { x: 1200, y: 50, escala: 0.9 },
      { x: 1580, y: 70, escala: 1.1 },
      { x: 1960, y: 45, escala: 0.95 },
      { x: 2350, y: 68, escala: 1.2 },
      { x: 2750, y: 52, escala: 1.0 }
    ];

    // Montanhas distantes (usam parallax mais lento para dar profundidade)
    const montanhas = [
      { x: 80,   largura: 260, altura: 170 },
      { x: 320,  largura: 310, altura: 210 },
      { x: 640,  largura: 250, altura: 155 },
      { x: 920,  largura: 340, altura: 220 },
      { x: 1280, largura: 280, altura: 180 },
      { x: 1580, largura: 320, altura: 205 },
      { x: 1920, largura: 270, altura: 165 }
    ];

    // Listas dinâmicas recriadas a cada nova corrida
    let barrasOuro = [];
    let inimigos = [];
    let particulas = [];

    // ========================================================================
    // 4. CONTROLES DE TECLADO E TOQUE
    // ========================================================================
    const teclas = {
      esquerda: false,
      direita: false
    };

    function executarPulo() {
      if (jogador.noChao && !jogoEncerrado) {
        jogador.velY = CONFIG.forcaPulo;
        jogador.noChao = false;
      }
    }

    canvas.addEventListener("mousedown", () => window.focus());

    window.addEventListener("keydown", (evento) => {
      const tecla = evento.key.toLowerCase();

      if (tecla === "arrowleft" || tecla === "a") teclas.esquerda = true;
      if (tecla === "arrowright" || tecla === "d") teclas.direita = true;

      if (evento.code === "Space" || tecla === "arrowup" || tecla === "w") {
        evento.preventDefault();
        executarPulo();
      }
    });

    window.addEventListener("keyup", (evento) => {
      const tecla = evento.key.toLowerCase();

      if (tecla === "arrowleft" || tecla === "a") teclas.esquerda = false;
      if (tecla === "arrowright" || tecla === "d") teclas.direita = false;
    });

    // Botões táteis para celulares/tablets
    function configurarBotaoTouch(idBotao, aoPressionar, aoSoltar) {
      const btn = document.getElementById(idBotao);
      if (!btn) return;
      btn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        aoPressionar();
      }, { passive: false });
      btn.addEventListener("touchend", (e) => {
        e.preventDefault();
        if (aoSoltar) aoSoltar();
      }, { passive: false });
      btn.addEventListener("mousedown", aoPressionar);
      if (aoSoltar) {
        btn.addEventListener("mouseup", aoSoltar);
        btn.addEventListener("mouseleave", aoSoltar);
      }
    }

    configurarBotaoTouch("btnEsq", () => { teclas.esquerda = true; }, () => { teclas.esquerda = false; });
    configurarBotaoTouch("btnDir", () => { teclas.direita = true; }, () => { teclas.direita = false; });
    configurarBotaoTouch("btnPular", executarPulo);

    // ========================================================================
    // 5. INICIALIZAÇÃO E REINÍCIO DA CORRIDA
    // ========================================================================
    function iniciarJogo() {
      pontos = 0;
      vidas = CONFIG.vidasIniciais;
      jogoEncerrado = false;
      cameraX = 0;
      mensagemAviso = "";
      tempoAviso = 0;
      particulas = [];

      // Reposiciona o Carro Monstro Azul na largada
      jogador.x = 60;
      jogador.y = 350;
      jogador.velX = 0;
      jogador.velY = 0;
      jogador.noChao = false;
      jogador.direcao = 1;
      jogador.anguloRoda = 0;
      jogador.invencivel = 0;

      // 15 Barras de Ouro espalhadas pela pista e plataformas
      barrasOuro = [
        // Trecho 1 (Aquecimento)
        { x: 260,  y: 372, largura: 32, altura: 18, coletada: false },
        { x: 445,  y: 282, largura: 32, altura: 18, coletada: false },
        { x: 525,  y: 282, largura: 32, altura: 18, coletada: false },

        // Trecho 2 (Primeiro inimigo e espinhos)
        { x: 810,  y: 372, largura: 32, altura: 18, coletada: false },
        { x: 1020, y: 282, largura: 32, altura: 18, coletada: false },
        { x: 1105, y: 282, largura: 32, altura: 18, coletada: false },

        // Trecho 3 (Plataformas altas)
        { x: 1395, y: 282, largura: 32, altura: 18, coletada: false },
        { x: 1620, y: 192, largura: 32, altura: 18, coletada: false },
        { x: 1720, y: 192, largura: 32, altura: 18, coletada: false },
        { x: 1892, y: 310, largura: 32, altura: 18, coletada: false },

        // Trecho 4 (Plataforma com patrulha e salto alto)
        { x: 2130, y: 282, largura: 32, altura: 18, coletada: false },
        { x: 2280, y: 282, largura: 32, altura: 18, coletada: false },
        { x: 2465, y: 197, largura: 32, altura: 18, coletada: false },
        { x: 2545, y: 197, largura: 32, altura: 18, coletada: false },

        // Trecho 5 (Reta final)
        { x: 2850, y: 310, largura: 32, altura: 18, coletada: false }
      ];

      // Carros Monstros Vermelhos patrulhando a pista e plataformas
      inimigos = [
        { x: 750,  y: 359, largura: 68, altura: 46, velX: 2.3, minX: 650,  maxX: 980,  anguloRoda: 0, vivo: true },
        { x: 1520, y: 359, largura: 68, altura: 46, velX: 2.6, minX: 1360, maxX: 1820, anguloRoda: 0, vivo: true },
        { x: 2160, y: 269, largura: 64, altura: 46, velX: 1.9, minX: 2085, maxX: 2355, anguloRoda: 0, vivo: true },
        { x: 2820, y: 359, largura: 68, altura: 46, velX: 2.8, minX: 2740, maxX: 2990, anguloRoda: 0, vivo: true }
      ];

      telaFinal.classList.add("oculto");
      btnReiniciar.blur();
      atualizarHUD();
    }

    btnReiniciar.addEventListener("click", iniciarJogo);

    function atualizarHUD() {
      const coletadas = barrasOuro.filter((b) => b.coletada).length;
      elPontos.textContent = pontos;
      elOuro.textContent = `${coletadas}/${barrasOuro.length}`;
      elVidas.textContent = vidas;
    }

    function mostrarAviso(texto) {
      mensagemAviso = texto;
      tempoAviso = 110;
    }

    // Gera faíscas/partículas ao coletar ouro ou esmagar inimigo
    function criarParticulas(x, y, cor, quantidade) {
      for (let i = 0; i < quantidade; i++) {
        particulas.push({
          x: x,
          y: y,
          velX: (Math.random() - 0.5) * 7,
          velY: (Math.random() - 0.8) * 6,
          tamanho: 3 + Math.random() * 4,
          cor: cor,
          vida: 28
        });
      }
    }

    // ========================================================================
    // 6. FÍSICA, COLISÕES E REGRAS DO JOGO
    // ========================================================================
    function verificarColisao(a, b) {
      return (
        a.x < b.x + b.largura &&
        a.x + a.largura > b.x &&
        a.y < b.y + b.altura &&
        a.y + a.altura > b.y
      );
    }

    function sofrerDano() {
      if (jogador.invencivel > 0) return;

      vidas--;
      atualizarHUD();
      criarParticulas(jogador.x + jogador.largura / 2, jogador.y + jogador.altura / 2, "#ef4444", 12);

      if (vidas <= 0) {
        finalizarJogo(false);
      } else {
        jogador.invencivel = 90; // 1.5 segundo piscando invencível
        jogador.velY = -7.5;
        mostrarAviso("Bateu! Cuidado com os carros vermelhos e espinhos!");
      }
    }

    function finalizarJogo(venceu) {
      jogoEncerrado = true;

      if (venceu) {
        const bonusVidas = vidas * CONFIG.bonusPorVida;
        const todasBarras = barrasOuro.every((b) => b.coletada);
        const bonusOuro = todasBarras ? CONFIG.bonusTodasBarras : 0;

        pontos += bonusVidas + bonusOuro;
        atualizarHUD();

        tituloFinal.textContent = "🏁 Vitória na Corrida!";
        tituloFinal.style.color = "#4ade80";

        let detalhes = `Você cruzou a linha de chegada e ganhou +${bonusVidas} pts de bônus pelas vidas!`;
        if (todasBarras) {
          detalhes += ` Bônus Ouro Completo: +${bonusOuro} pts!`;
        }
        textoFinal.textContent = detalhes;
      } else {
        tituloFinal.textContent = "💥 Fim de Jogo!";
        tituloFinal.style.color = "#f87171";
        textoFinal.textContent = "Seu Carro Monstro ficou sem vidas. Tente novamente!";
      }

      pontosFinais.textContent = pontos;
      telaFinal.classList.remove("oculto");
    }

    function atualizar() {
      if (jogoEncerrado) return;

      if (jogador.invencivel > 0) jogador.invencivel--;
      if (tempoAviso > 0) tempoAviso--;

      // 1. Movimento Horizontal e Giro das Rodas
      jogador.velX = 0;
      if (teclas.esquerda) {
        jogador.velX = -CONFIG.velocidadeJogador;
        jogador.direcao = -1;
      }
      if (teclas.direita) {
        jogador.velX = CONFIG.velocidadeJogador;
        jogador.direcao = 1;
      }

      jogador.x += jogador.velX;
      jogador.anguloRoda += jogador.velX * 0.12;

      // Impede sair antes do início da pista ou depois do fim
      if (jogador.x < 0) jogador.x = 0;
      if (jogador.x + jogador.largura > CONFIG.larguraFase) {
        jogador.x = CONFIG.larguraFase - jogador.largura;
      }

      // Colisão lateral com plataformas
      for (const plat of plataformas) {
        if (verificarColisao(jogador, plat)) {
          if (jogador.velX > 0) jogador.x = plat.x - jogador.largura;
          if (jogador.velX < 0) jogador.x = plat.x + plat.largura;
        }
      }

      // 2. Movimento Vertical e Gravidade
      jogador.velY += CONFIG.gravidade;
      jogador.noChao = false;
      jogador.y += jogador.velY;

      for (const plat of plataformas) {
        if (verificarColisao(jogador, plat)) {
          if (jogador.velY > 0) {
            jogador.y = plat.y - jogador.altura;
            jogador.velY = 0;
            jogador.noChao = true;
          } else if (jogador.velY < 0) {
            jogador.y = plat.y + plat.altura;
            jogador.velY = 0;
          }
        }
      }

      // 3. Atualização da Câmera Side-Scrolling
      const alvoCamera = jogador.x - canvas.width * 0.32;
      cameraX = Math.max(0, Math.min(alvoCamera, CONFIG.larguraFase - canvas.width));

      // 4. Coleta das Barras de Ouro
      for (const barra of barrasOuro) {
        if (barra.coletada) continue;

        if (verificarColisao(jogador, barra)) {
          barra.coletada = true;
          pontos += CONFIG.pontosPorBarra;
          atualizarHUD();
          criarParticulas(barra.x + barra.largura / 2, barra.y + barra.altura / 2, "#facc15", 10);
        }
      }

      // 5. Patrulha e Colisão com Carros Monstros Vermelhos
      for (const inimigo of inimigos) {
        if (!inimigo.vivo) continue;

        inimigo.x += inimigo.velX;
        inimigo.anguloRoda += inimigo.velX * 0.12;

        if (inimigo.x <= inimigo.minX || inimigo.x + inimigo.largura >= inimigo.maxX) {
          inimigo.velX *= -1;
        }

        if (verificarColisao(jogador, inimigo)) {
          const baseAnterior = jogador.y + jogador.altura - jogador.velY;
          // Esmaga o carro inimigo se cair por cima do teto dele
          if (jogador.velY > 0 && baseAnterior <= inimigo.y + inimigo.altura * 0.55) {
            inimigo.vivo = false;
            jogador.velY = -11; // Quica para cima
            pontos += CONFIG.pontosPorInimigo;
            atualizarHUD();
            criarParticulas(inimigo.x + inimigo.largura / 2, inimigo.y + 15, "#f97316", 16);
            mostrarAviso(`+${CONFIG.pontosPorInimigo} pts! Carro inimigo esmagado!`);
          } else {
            sofrerDano();
          }
        }
      }

      // 6. Colisão com Espinhos
      for (const esp of espinhos) {
        if (verificarColisao(jogador, esp)) {
          sofrerDano();
        }
      }

      // 7. Atualização das Partículas
      for (let i = particulas.length - 1; i >= 0; i--) {
        const p = particulas[i];
        p.x += p.velX;
        p.y += p.velY;
        p.velY += 0.25;
        p.vida--;
        if (p.vida <= 0) particulas.splice(i, 1);
      }

      // 8. Verificação da Linha de Chegada Quadriculada
      if (jogador.x + jogador.largura >= CONFIG.posicaoChegada) {
        finalizarJogo(true);
      }
    }

    // ========================================================================
    // 7. FUNÇÕES DE DESENHO NO CANVAS 2D
    // ========================================================================

    // Desenha tanto o Carro Monstro Azul (jogador) quanto os Vermelhos (inimigos)
    function desenharCarroMonstro(x, y, largura, altura, direcao, anguloRoda, ehInimigo) {
      ctx.save();
      // Espelha horizontalmente o desenho conforme a direção do movimento
      ctx.translate(x + largura / 2, y);
      ctx.scale(direcao, 1);
      const ox = -largura / 2;

      const corPrincipal = ehInimigo ? CONFIG.corCarroInimigo : CONFIG.corCarroJogador;
      const corEscura = ehInimigo ? "#991b1b" : "#1d4ed8";
      const corFaixa = ehInimigo ? "#1e293b" : CONFIG.corFaixaJogador;

      // 1. Suspensão e amortecedores
      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(ox + 16, 24);
      ctx.lineTo(ox + 16, altura - 13);
      ctx.moveTo(ox + largura - 16, 24);
      ctx.lineTo(ox + largura - 16, altura - 13);
      ctx.stroke();

      // 2. Cano de escapamento traseiro
      ctx.fillStyle = "#475569";
      ctx.fillRect(ox + 4, 14, 5, 11);

      // 3. Carroceria estilo Picape Monster Truck
      ctx.fillStyle = corPrincipal;
      ctx.beginPath();
      ctx.moveTo(ox + 3, 25);               // Traseira inferior
      ctx.lineTo(ox + 3, 14);               // Caçamba traseira
      ctx.lineTo(ox + 22, 14);              // Início da cabine
      ctx.lineTo(ox + 28, 3);               // Teto traseiro da cabine
      ctx.lineTo(ox + 48, 3);               // Teto dianteiro da cabine
      ctx.lineTo(ox + 56, 14);              // Base do para-brisa
      ctx.lineTo(ox + largura - 3, 16);     // Capô frontal
      ctx.lineTo(ox + largura - 3, 26);     // Frente inferior
      ctx.closePath();
      ctx.fill();

      // Contorno da carroceria
      ctx.strokeStyle = corEscura;
      ctx.lineWidth = 2;
      ctx.stroke();

      // 4. Faixa lateral esportiva
      ctx.fillStyle = corFaixa;
      ctx.fillRect(ox + 5, 19, largura - 10, 4);

      // 5. Para-brisa / Janela da cabine
      ctx.fillStyle = ehInimigo ? "#0f172a" : "#bae6fd";
      ctx.beginPath();
      ctx.moveTo(ox + 30, 6);
      ctx.lineTo(ox + 46, 6);
      ctx.lineTo(ox + 53, 14);
      ctx.lineTo(ox + 30, 14);
      ctx.closePath();
      ctx.fill();

      // Detalhe "bravo" no vidro se for inimigo vermelho
      if (ehInimigo) {
        ctx.strokeStyle = "#facc15";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(ox + 36, 8);
        ctx.lineTo(ox + 50, 12);
        ctx.stroke();

        // Para-choque dianteiro reforçado de aço
        ctx.fillStyle = "#334155";
        ctx.fillRect(ox + largura - 5, 17, 7, 10);
      } else {
        // Farol dianteiro amarelo brilhante do jogador
        ctx.fillStyle = "#fef08a";
        ctx.fillRect(ox + largura - 5, 17, 4, 5);
      }

      // 6. Duas Rodas Gigantes com Calotas Giratórias
      const raioRoda = 13;
      const posicoesRodas = [ox + 16, ox + largura - 16];
      const centroY = altura - raioRoda;

      for (const centroX of posicoesRodas) {
        // Pneu preto gigante
        ctx.fillStyle = "#0f172a";
        ctx.beginPath();
        ctx.arc(centroX, centroY, raioRoda, 0, Math.PI * 2);
        ctx.fill();

        // Cravos/garras do pneu girando
        ctx.strokeStyle = "#334155";
        ctx.lineWidth = 2;
        for (let i = 0; i < 6; i++) {
          const ang = anguloRoda + (i * Math.PI) / 3;
          ctx.beginPath();
          ctx.moveTo(centroX + Math.cos(ang) * (raioRoda - 3), centroY + Math.sin(ang) * (raioRoda - 3));
          ctx.lineTo(centroX + Math.cos(ang) * (raioRoda + 1), centroY + Math.sin(ang) * (raioRoda + 1));
          ctx.stroke();
        }

        // Calota prateada
        ctx.fillStyle = "#cbd5e1";
        ctx.beginPath();
        ctx.arc(centroX, centroY, 6, 0, Math.PI * 2);
        ctx.fill();

        // Raios da calota girando
        ctx.strokeStyle = "#475569";
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 3; i++) {
          const ang = anguloRoda + (i * Math.PI) / 3;
          ctx.beginPath();
          ctx.moveTo(centroX - Math.cos(ang) * 5, centroY - Math.sin(ang) * 5);
          ctx.lineTo(centroX + Math.cos(ang) * 5, centroY + Math.sin(ang) * 5);
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    // Desenha uma Barra de Ouro 3D trapezoidal com brilho
    function desenharBarraOuro(barra) {
      const flutuacao = Math.sin(Date.now() / 220 + barra.x * 0.05) * 3;
      const x = barra.x;
      const y = barra.y + flutuacao;
      const w = barra.largura;
      const h = barra.altura;

      // Face frontal trapezoidal dourada (#eab308)
      ctx.fillStyle = "#eab308";
      ctx.beginPath();
      ctx.moveTo(x + 5, y);
      ctx.lineTo(x + w - 5, y);
      ctx.lineTo(x + w, y + h);
      ctx.lineTo(x, y + h);
      ctx.closePath();
      ctx.fill();

      // Brilho superior (#fef08a)
      ctx.fillStyle = "#fef08a";
      ctx.beginPath();
      ctx.moveTo(x + 6, y + 1);
      ctx.lineTo(x + w - 6, y + 1);
      ctx.lineTo(x + w - 9, y + 6);
      ctx.lineTo(x + 9, y + 6);
      ctx.closePath();
      ctx.fill();

      // Sombra lateral direita (#a16207)
      ctx.fillStyle = "#a16207";
      ctx.beginPath();
      ctx.moveTo(x + w - 5, y);
      ctx.lineTo(x + w, y + h);
      ctx.lineTo(x + w - 7, y + h);
      ctx.lineTo(x + w - 9, y + 6);
      ctx.closePath();
      ctx.fill();

      // Contorno nítido
      ctx.strokeStyle = "#713f12";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x + 5, y);
      ctx.lineTo(x + w - 5, y);
      ctx.lineTo(x + w, y + h);
      ctx.lineTo(x, y + h);
      ctx.closePath();
      ctx.stroke();

      // Pequeno brilho estrelado piscando
      const pulso = (Math.sin(Date.now() / 180 + barra.x) + 1) / 2;
      if (pulso > 0.45) {
        const bx = x + 9;
        const by = y + 3;
        const tam = 4 * pulso;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(bx - tam, by);
        ctx.lineTo(bx + tam, by);
        ctx.moveTo(bx, by - tam);
        ctx.lineTo(bx, by + tam);
        ctx.stroke();
      }
    }

    // Desenha a Linha de Chegada Quadriculada no final da corrida
    function desenharLinhaChegada() {
      const x = CONFIG.posicaoChegada;
      const topo = 215;
      const base = 405;

      // Mastro metálico
      ctx.fillStyle = "#e2e8f0";
      ctx.fillRect(x, topo, 8, base - topo);

      // Bandeira quadriculada grande no topo
      const largBandeira = 72;
      const altBandeira = 48;
      const cols = 6;
      const rows = 4;
      const tamQ = largBandeira / cols;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          ctx.fillStyle = (r + c) % 2 === 0 ? "#ffffff" : "#0f172a";
          ctx.fillRect(x + 8 + c * tamQ, topo + r * tamQ, tamQ, tamQ);
        }
      }

      ctx.strokeStyle = "#0f172a";
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 8, topo, largBandeira, altBandeira);

      // Placa "CHEGADA"
      ctx.fillStyle = "#facc15";
      ctx.fillRect(x - 16, topo - 28, 86, 22);
      ctx.strokeStyle = "#0f172a";
      ctx.strokeRect(x - 16, topo - 28, 86, 22);

      ctx.fillStyle = "#0f172a";
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("CHEGADA", x + 27, topo - 13);
      ctx.textAlign = "left";
    }

    // Desenha a barra de progresso da corrida no topo do Canvas
    function desenharBarraProgresso() {
      const barX = 190;
      const barY = 14;
      const barW = 420;
      const barH = 14;

      const progresso = Math.max(0, Math.min(1, (jogador.x - 60) / (CONFIG.posicaoChegada - 60)));

      // Fundo da barra
      ctx.fillStyle = "rgba(15, 23, 42, 0.72)";
      ctx.beginPath();
      ctx.roundRect(barX, barY, barW, barH, 7);
      ctx.fill();

      // Preenchimento dourado/verde do trajeto concluído
      ctx.fillStyle = "#22c55e";
      ctx.beginPath();
      ctx.roundRect(barX + 2, barY + 2, Math.max(8, (barW - 4) * progresso), barH - 4, 5);
      ctx.fill();

      // Marcador azul da posição atual do jogador
      const marcadorX = barX + 6 + (barW - 18) * progresso;
      ctx.fillStyle = "#38bdf8";
      ctx.beginPath();
      ctx.arc(marcadorX, barY + barH / 2, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Bandeirinha no final da barra
      ctx.fillStyle = "#facc15";
      ctx.font = "bold 12px sans-serif";
      ctx.fillText("🏁", barX + barW + 8, barY + 12);
    }

    function desenhar() {
      // 1. Céu em degradê (fixo na tela)
      const gradienteCeu = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradienteCeu.addColorStop(0, CONFIG.corCeuTopo);
      gradienteCeu.addColorStop(1, CONFIG.corCeuBase);
      ctx.fillStyle = gradienteCeu;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Sol decorativo no céu
      ctx.fillStyle = "rgba(254, 240, 138, 0.9)";
      ctx.beginPath();
      ctx.arc(710, 75, 34, 0, Math.PI * 2);
      ctx.fill();

      // 2. Montanhas distantes com efeito PARALLAX lento (0.2x)
      for (const m of montanhas) {
        const mx = m.x - cameraX * 0.2;
        if (mx + m.largura < -50 || mx > canvas.width + 50) continue;

        ctx.fillStyle = "#64748b";
        ctx.beginPath();
        ctx.moveTo(mx, 405);
        ctx.lineTo(mx + m.largura / 2, 405 - m.altura);
        ctx.lineTo(mx + m.largura, 405);
        ctx.closePath();
        ctx.fill();

        // Pico nevado
        ctx.fillStyle = "#f1f5f9";
        ctx.beginPath();
        ctx.moveTo(mx + m.largura / 2, 405 - m.altura);
        ctx.lineTo(mx + m.largura / 2 - m.largura * 0.14, 405 - m.altura * 0.72);
        ctx.lineTo(mx + m.largura / 2 + m.largura * 0.14, 405 - m.altura * 0.72);
        ctx.closePath();
        ctx.fill();
      }

      // 3. Nuvens com efeito PARALLAX suave (0.35x)
      ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
      for (const nuvem of nuvens) {
        const nx = nuvem.x - cameraX * 0.35;
        if (nx < -100 || nx > canvas.width + 100) continue;

        ctx.beginPath();
        ctx.arc(nx, nuvem.y, 20 * nuvem.escala, 0, Math.PI * 2);
        ctx.arc(nx + 22 * nuvem.escala, nuvem.y - 6 * nuvem.escala, 24 * nuvem.escala, 0, Math.PI * 2);
        ctx.arc(nx + 46 * nuvem.escala, nuvem.y, 18 * nuvem.escala, 0, Math.PI * 2);
        ctx.fill();
      }

      // ======================================================================
      // A PARTIR DAQUI OS ELEMENTOS SEGUEM A CÂMERA DO MUNDO (cameraX)
      // ======================================================================
      ctx.save();
      ctx.translate(-cameraX, 0);

      // 4. Plataformas e Chão de Terra com Grama
      for (const plat of plataformas) {
        if (plat.x + plat.largura < cameraX || plat.x > cameraX + canvas.width) continue;

        ctx.fillStyle = CONFIG.corPlataforma;
        ctx.fillRect(plat.x, plat.y, plat.largura, plat.altura);

        ctx.fillStyle = CONFIG.corGrama;
        ctx.fillRect(plat.x, plat.y, plat.largura, 7);
      }

      // Pedrinhas decorativas e placas de distância na estrada
      ctx.fillStyle = "#5c280a";
      for (let px = 40; px < CONFIG.larguraFase; px += 90) {
        if (px < cameraX - 20 || px > cameraX + canvas.width + 20) continue;
        ctx.fillRect(px, 422, 10, 5);
        ctx.fillRect(px + 38, 433, 14, 5);
      }

      for (let dist = 500; dist < CONFIG.posicaoChegada; dist += 500) {
        if (dist < cameraX - 60 || dist > cameraX + canvas.width + 60) continue;
        ctx.fillStyle = "#334155";
        ctx.fillRect(dist, 372, 4, 33);
        ctx.fillStyle = "#f8fafc";
        ctx.fillRect(dist - 22, 354, 48, 20);
        ctx.strokeStyle = "#334155";
        ctx.strokeRect(dist - 22, 354, 48, 20);
        ctx.fillStyle = "#0f172a";
        ctx.font = "bold 11px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`${dist}m`, dist + 2, 368);
        ctx.textAlign = "left";
      }

      // 5. Espinhos triangulares
      ctx.fillStyle = CONFIG.corEspinho;
      for (const esp of espinhos) {
        if (esp.x + esp.largura < cameraX || esp.x > cameraX + canvas.width) continue;
        const qtdDentes = 3;
        const larguraDente = esp.largura / qtdDentes;
        for (let i = 0; i < qtdDentes; i++) {
          const inicioX = esp.x + i * larguraDente;
          ctx.beginPath();
          ctx.moveTo(inicioX, esp.y + esp.altura);
          ctx.lineTo(inicioX + larguraDente / 2, esp.y);
          ctx.lineTo(inicioX + larguraDente, esp.y + esp.altura);
          ctx.closePath();
          ctx.fill();
        }
      }

      // 6. Linha de Chegada Quadriculada
      desenharLinhaChegada();

      // 7. Barras de Ouro
      for (const barra of barrasOuro) {
        if (barra.coletada) continue;
        if (barra.x + barra.largura < cameraX || barra.x > cameraX + canvas.width) continue;
        desenharBarraOuro(barra);
      }

      // 8. Inimigos: Carros Monstros Vermelhos
      for (const inimigo of inimigos) {
        if (!inimigo.vivo) continue;
        if (inimigo.x + inimigo.largura < cameraX || inimigo.x > cameraX + canvas.width) continue;
        const dirInimigo = inimigo.velX >= 0 ? 1 : -1;
        desenharCarroMonstro(
          inimigo.x,
          inimigo.y,
          inimigo.largura,
          inimigo.altura,
          dirInimigo,
          inimigo.anguloRoda,
          true
        );
      }

      // 9. Jogador: Carro Monstro Azul (pisca quando invencível)
      const visivel = jogador.invencivel === 0 || Math.floor(jogador.invencivel / 6) % 2 === 0;
      if (visivel) {
        desenharCarroMonstro(
          jogador.x,
          jogador.y,
          jogador.largura,
          jogador.altura,
          jogador.direcao,
          jogador.anguloRoda,
          false
        );
      }

      // 10. Partículas de impacto e ouro
      for (const p of particulas) {
        ctx.fillStyle = p.cor;
        ctx.fillRect(p.x, p.y, p.tamanho, p.tamanho);
      }

      ctx.restore();

      // ======================================================================
      // ELEMENTOS FIXOS NA TELA (HUD DO CANVAS)
      // ======================================================================
      desenharBarraProgresso();

      if (tempoAviso > 0) {
        ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
        ctx.beginPath();
        ctx.roundRect(170, 38, 460, 32, 8);
        ctx.fill();
        ctx.fillStyle = "#facc15";
        ctx.font = "bold 14px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(mensagemAviso, canvas.width / 2, 59);
        ctx.textAlign = "left";
      }
    }

    // ========================================================================
    // 8. LOOP PRINCIPAL DO JOGO (60 FPS)
    // ========================================================================
    function loopJogo() {
      atualizar();
      desenhar();
      requestAnimationFrame(loopJogo);
    }

    window.onload = function () {
      iniciarJogo();
      loopJogo();
    };
  </script>
</body>
